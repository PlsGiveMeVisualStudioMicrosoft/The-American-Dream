l_english:
 # State modifiers
 BLZ_civil_defence_state_modifier:0 "Civil Defence Committees"
 BLZ_civil_defence_state_modifier_desc:0 "Local wardens, prepared shelters and village-level planning make mobilisation faster and an occupation more costly."
 BLZ_distributed_stockpiles_state_modifier:0 "Distributed Reserve Stockpiles"
 BLZ_distributed_stockpiles_state_modifier_desc:0 "Weapons, food and medical stores have been dispersed away from a handful of vulnerable depots."
 BLZ_emergency_comms_state_modifier:0 "Emergency Radio Network"
 BLZ_emergency_comms_state_modifier_desc:0 "Civilian stations, BDF signals teams and local authorities maintain command links even when roads or telephone lines fail."
 BLZ_sarstoon_denial_state_modifier:0 "Sarstoon Denial Positions"
 BLZ_sarstoon_denial_state_modifier_desc:0 "Prepared river positions and concealed jungle routes slow hostile movement through southern Belize."
 BLZ_continuity_state_modifier:0 "Continuity Sites around Belmopan"
 BLZ_continuity_state_modifier_desc:0 "Dispersed command posts and emergency reserves allow the state to function under attack."
 BLZ_frontline_rotation_state_modifier:0 "Rotated Frontline Battalions"
 BLZ_frontline_rotation_state_modifier_desc:0 "Exhausted companies have been withdrawn in stages while fresh personnel take over prepared positions."
 GUA_peten_rotation_state_modifier:0 "Rotating Petén Brigades"
 GUA_peten_rotation_state_modifier_desc:0 "A planned rotation reduces disease, fatigue and organisational decay among units deployed in Petén."
 GUA_requisitioned_transport_state_modifier:0 "Requisitioned Commercial Transport"
 GUA_requisitioned_transport_state_modifier_desc:0 "Civilian buses and trucks temporarily increase operational mobility, though maintenance and congestion remain serious problems."
 GUA_closed_crossings_state_modifier:0 "Closed Informal Crossings"
 GUA_closed_crossings_state_modifier_desc:0 "Informal routes have been sealed and monitored, restricting movement and local commerce on both sides of the frontier."
 GUA_limited_mobilisation_state_modifier:0 "Limited Petén Mobilisation"
 GUA_limited_mobilisation_state_modifier_desc:0 "Additional troops have crowded into Petén. Defensive readiness improves, but roads and depots are under severe pressure."

 # Haiti–Belize reciprocal aid
 HAI_request_belizean_assistance:0 "Request Belizean Assistance"
 HAI_request_belizean_assistance_desc:0 "Ask Belize for weapons or a BDF security detachment. Requires an active Haitian crisis, at least §Y40 escalation§!, peace in both countries, Belize–Guatemala tension below §Y40§!, and no previous request."
 HAI_honour_belizean_troop_debt:0 "Honour the Troop Commitment to Belize"
 HAI_honour_belizean_troop_debt_desc:0 "Haiti is at peace and Belize is fighting Guatemala. Dispatch the Haitian Solidarity Brigade automatically promised in return for the earlier BDF deployment."
 HAI_honour_belizean_arms_debt:0 "Repay Belize with Arms"
 HAI_honour_belizean_arms_debt_desc:0 "Haiti is at peace and Belize is fighting Guatemala. Return the earlier material assistance with rifles and support equipment."

 # Belize focuses
 BLZ_civil_defence_committees:0 "Civil Defence Committees"
 BLZ_civil_defence_committees_desc:0 "Turn schools, village councils and public-service offices into a nationwide emergency network."
 BLZ_disperse_reserve_stocks:0 "Disperse the Reserve Stocks"
 BLZ_disperse_reserve_stocks_desc:0 "No single strike or road closure should be able to cut the BDF off from food, ammunition and medical stores."
 BLZ_continuity_of_government:0 "Continuity of Government"
 BLZ_continuity_of_government_desc:0 "Prepare alternate ministries, secure records and emergency command sites around Belmopan."
 BLZ_hold_the_sarstoon:0 "Hold the Sarstoon"
 BLZ_hold_the_sarstoon_desc:0 "The southern rivers and jungle approaches must become obstacles rather than avenues of advance."
 BLZ_emergency_radio_network:0 "An Emergency Radio Network"
 BLZ_emergency_radio_network_desc:0 "Link the BDF, police, district authorities and volunteer wardens through resilient radio communications."
 BLZ_civilian_logistics_corps:0 "Civilian Logistics Corps"
 BLZ_civilian_logistics_corps_desc:0 "Register reliable drivers, mechanics, boats and trucks before the crisis becomes a war."
 BLZ_integrated_defence_command:0 "Integrated Defence Command"
 BLZ_integrated_defence_command_desc:0 "Combine the regular battalions, volunteers, police and civil defence under one national survival plan."
 BLZ_western_highway_redoubts:0 "Western Highway Redoubts"
 BLZ_western_highway_redoubts_desc:0 "Fortify selected road junctions and prepare fallback positions without attempting to defend every metre of frontier."
 BLZ_caricom_mutual_aid_protocol:0 "CARICOM Mutual-Aid Protocol"
 BLZ_caricom_mutual_aid_protocol_desc:0 "Transform political solidarity into prearranged transport, supply and communications support."
 BLZ_national_survival_plan:0 "The National Survival Plan"
 BLZ_national_survival_plan_desc:0 "Belize cannot match Guatemala in mass. It can remain coherent, supplied and politically unbroken until international pressure ends the war."

 # Guatemala focuses
 GUA_peten_engineer_battalions:0 "Petén Engineer Battalions"
 GUA_peten_engineer_battalions_desc:0 "Road repair, bridging and field works are more decisive in the north than another parade-ground formation."
 GUA_peten_field_hospitals:0 "Petén Field Hospitals"
 GUA_peten_field_hospitals_desc:0 "Disease and exhaustion can destroy a deployment before the enemy does. Establish a permanent medical network."
 GUA_adjacency_zone_command:0 "Adjacency Zone Command"
 GUA_adjacency_zone_command_desc:0 "Create a unified headquarters for patrols, intelligence, logistics and political reporting near Belize."
 GUA_claim_information_office:0 "The Claim Information Office"
 GUA_claim_information_office_desc:0 "Coordinate maps, legal arguments, speeches and public messaging around the territorial claim."
 GUA_diplomatically_isolate_belize:0 "Diplomatically Isolate Belize"
 GUA_diplomatically_isolate_belize_desc:0 "Persuade regional governments that Guatemala seeks negotiation while Belize obstructs a settlement."
 GUA_last_chance_mediation:0 "A Last Chance for Mediation"
 GUA_last_chance_mediation_desc:0 "Open a discreet channel before military preparations acquire their own momentum."
 GUA_requisition_transport_fleet:0 "Requisition the Transport Fleet"
 GUA_requisition_transport_fleet_desc:0 "Prepare commercial trucks and buses to reinforce the thin military transport network in Petén."
 GUA_sustain_extended_campaign:0 "Sustain an Extended Campaign"
 GUA_sustain_extended_campaign_desc:0 "Stockpile equipment and complete the forward network needed for operations lasting longer than a few weeks."
 GUA_limited_border_operation:0 "A Limited Border Operation"
 GUA_limited_border_operation_desc:0 "Test Belizean readiness with a controlled mobilisation short of a formal ultimatum."
 GUA_national_claim_consensus:0 "A National Consensus on the Claim"
 GUA_national_claim_consensus_desc:0 "Unite otherwise hostile political blocs around a single territorial position."
 GUA_post_dispute_development_plan:0 "Post-Dispute Development Plan"
 GUA_post_dispute_development_plan_desc:0 "A peaceful settlement should redirect attention toward roads, schools and legal cross-border commerce."
 GUA_central_american_security_conference:0 "Central American Security Conference"
 GUA_central_american_security_conference_desc:0 "Use Guatemala's regional weight to coordinate border security and counter-trafficking without subordinating neighbours."

 # Belize decisions
 BLZ_run_civil_defence_drill:0 "Run a National Civil-Defence Drill"
 BLZ_run_civil_defence_drill_desc:0 "Test warning procedures, shelters and district communications. Guatemala will notice the mobilisation."
 BLZ_disperse_emergency_stockpiles:0 "Disperse Emergency Stockpiles"
 BLZ_disperse_emergency_stockpiles_desc:0 "Move reserve equipment from exposed central depots into concealed regional stores."
 BLZ_requisition_civilian_transport:0 "Requisition Civilian Transport"
 BLZ_requisition_civilian_transport_desc:0 "Temporarily register trucks and drivers for military logistics at a small political cost."
 BLZ_establish_emergency_radio_net:0 "Activate the Emergency Radio Net"
 BLZ_establish_emergency_radio_net_desc:0 "Bring the prepared national communications network to full readiness."
 BLZ_evacuate_border_communities:0 "Evacuate Vulnerable Border Communities"
 BLZ_evacuate_border_communities_desc:0 "Move civilians away from likely contact areas before roads become military targets."
 BLZ_caricom_emergency_airlift:0 "Request a CARICOM Emergency Airlift"
 BLZ_caricom_emergency_airlift_desc:0 "Use the mutual-aid protocol to obtain a limited shipment of rifles, support equipment and vehicles."
 BLZ_request_oas_emergency_session:0 "Request an OAS Emergency Session"
 BLZ_request_oas_emergency_session_desc:0 "Force the confrontation into public regional diplomacy before military pressure becomes irreversible."
 BLZ_rotate_frontline_battalions:0 "Rotate Frontline Battalions"
 BLZ_rotate_frontline_battalions_desc:0 "Rest exhausted troops without abandoning the prepared line."
 BLZ_prepare_sarstoon_denial_positions:0 "Complete Sarstoon Denial Positions"
 BLZ_prepare_sarstoon_denial_positions_desc:0 "Finish concealed river positions, obstacles and fallback routes in southern Belize."

 # Guatemala decisions
 GUA_rotate_peten_brigades:0 "Rotate the Petén Brigades"
 GUA_rotate_peten_brigades_desc:0 "Reduce fatigue and disease through a scheduled troop rotation."
 GUA_requisition_commercial_transport:0 "Requisition Commercial Transport"
 GUA_requisition_commercial_transport_desc:0 "Use civilian vehicles to increase mobility in Petén, accepting congestion and political costs."
 GUA_adjacency_mapping_mission:0 "Launch an Adjacency Mapping Mission"
 GUA_adjacency_mapping_mission_desc:0 "Send survey and security teams to document routes and reinforce Guatemala's claim."
 GUA_offer_border_development_fund:0 "Offer a Border Development Fund"
 GUA_offer_border_development_fund_desc:0 "Offer practical investment without formally changing either government's legal position."
 GUA_close_informal_crossings:0 "Close Informal Border Crossings"
 GUA_close_informal_crossings_desc:0 "Seal unofficial routes to demonstrate control and restrict Belizean movement."
 GUA_launch_claim_broadcasts:0 "Launch National Claim Broadcasts"
 GUA_launch_claim_broadcasts_desc:0 "Use radio and television to revive public support for the territorial claim."
 GUA_open_secret_backchannel:0 "Open a Secret Backchannel"
 GUA_open_secret_backchannel_desc:0 "Test whether Belmopan will discuss de-escalation away from cameras and public ultimatums."
 GUA_limited_peten_mobilisation:0 "Limited Petén Mobilisation"
 GUA_limited_peten_mobilisation_desc:0 "Move additional personnel and equipment north without issuing a formal ultimatum."
 GUA_order_temporary_stand_down:0 "Order a Temporary Stand-Down"
 GUA_order_temporary_stand_down_desc:0 "Reduce patrol intensity to recover political room and lower the chance of an accidental clash."

 # Events
 tad_bg.400.t:0 "Belize Runs a Civil-Defence Drill"
 tad_bg.400.d:0 "Sirens, radio checks and district-level exercises have taken place across Belize. Belmopan describes the activity as defensive preparedness, but our commanders warn that the country is learning how to mobilise quickly."
 tad_bg.400.a:0 "Update our readiness estimates."
 tad_bg.400.b:0 "Present this as militarisation."
 tad_bg.401.t:0 "Belize Disperses Its Reserve Stores"
 tad_bg.401.d:0 "Belizean ammunition, medical supplies and food reserves are being moved from central depots into smaller concealed sites. A rapid strike would now be less likely to paralyse the BDF."
 tad_bg.401.a:0 "Our planning must account for it."
 tad_bg.402.t:0 "A CARICOM Airlift Reaches Belize"
 tad_bg.402.d:0 "A limited regional airlift has delivered military and logistical supplies to Belize. The shipment is modest, but it demonstrates that Belmopan is not politically isolated."
 tad_bg.402.a:0 "Condemn foreign involvement."
 tad_bg.402.b:0 "Do not magnify a small shipment."
 tad_bg.403.t:0 "Belize Calls an OAS Emergency Session"
 tad_bg.403.d:0 "Belize has requested urgent regional consultations, placing our latest measures under international scrutiny."
 tad_bg.403.a:0 "Send a restrained delegation."
 tad_bg.403.b:0 "Reject outside pressure."
 tad_bg.410.t:0 "Guatemalan Survey Teams Approach the Line"
 tad_bg.410.d:0 "Guatemalan surveyors accompanied by security personnel have begun documenting routes near the Adjacency Line. Their stated purpose is cartographic; the BDF views the mission as reconnaissance."
 tad_bg.410.a:0 "Request OAS observers."
 tad_bg.410.b:0 "Shadow them with BDF patrols."
 tad_bg.411.t:0 "Guatemala Offers a Border Development Fund"
 tad_bg.411.d:0 "Guatemala proposes financing roads, clinics and regulated commerce near the border while both sides preserve their legal claims. The offer could reduce local tension, but it may also create political ambiguity."
 tad_bg.411.a:0 "Accept practical cooperation."
 tad_bg.411.b:0 "Sovereignty must remain unambiguous."
 tad_bg.412.t:0 "Guatemala Closes Informal Crossings"
 tad_bg.412.d:0 "Guatemalan forces have sealed several unofficial routes used by border communities. Local trade has been disrupted and patrol contact is increasing."
 tad_bg.412.a:0 "Document the humanitarian impact."
 tad_bg.412.b:0 "Adapt our patrol network."
 tad_bg.413.t:0 "Guatemalan Claim Broadcasts Intensify"
 tad_bg.413.d:0 "A coordinated media campaign is presenting the territorial claim as an unfinished national duty. Belizean audiences can receive some of the broadcasts directly."
 tad_bg.413.a:0 "Answer with a sovereignty campaign."
 tad_bg.413.b:0 "Do not amplify it."
 tad_bg.414.t:0 "A Discreet Message from Guatemala City"
 tad_bg.414.d:0 "An intermediary says Guatemala is prepared to discuss patrol limits and confidence-building measures away from public attention. The channel may be sincere, or an attempt to divide Belize from its international partners."
 tad_bg.414.a:0 "Explore a quiet de-escalation."
 tad_bg.414.b:0 "Any talks must include the OAS."
 tad_bg.414.c:0 "Reject secret bargaining."
 tad_bg.415.t:0 "Belize Invites OAS Observers"
 tad_bg.415.d:0 "Belize has answered our mapping mission by requesting independent observation rather than direct confrontation."
 tad_bg.415.a:0 "Proceed carefully."
 tad_bg.416.t:0 "BDF Patrols Shadow the Survey Teams"
 tad_bg.416.d:0 "Belizean patrols are following our survey teams at a controlled distance. A minor error could now become an international incident."
 tad_bg.416.a:0 "Maintain discipline."
 tad_bg.417.t:0 "Belize Accepts the Development Offer"
 tad_bg.417.d:0 "Belize has agreed to practical local projects without conceding its legal position. The decision creates room for a quieter frontier."
 tad_bg.417.a:0 "Begin with modest projects."
 tad_bg.418.t:0 "Belize Rejects the Development Fund"
 tad_bg.418.d:0 "Belmopan argues that the proposal could blur sovereignty and has refused participation."
 tad_bg.418.a:0 "The refusal will be remembered."
 tad_bg.419.t:0 "Belize Counters the Claim Broadcasts"
 tad_bg.419.d:0 "Belize has launched its own public campaign, framing the dispute as a test of national survival and international law."
 tad_bg.419.a:0 "The information contest continues."
 tad_bg.420.t:0 "Civilian Transport Is Requisitioned in Petén"
 tad_bg.420.d:0 "Commercial trucks and buses are being registered for Guatemalan military use. The measure points to preparations for a larger or longer deployment."
 tad_bg.420.a:0 "Update the BDF mobilisation plan."
 tad_bg.421.t:0 "Limited Mobilisation in Petén"
 tad_bg.421.d:0 "Additional Guatemalan troops and equipment are moving into Petén. The mobilisation stops short of an ultimatum, but its scale cannot be dismissed as routine patrol activity."
 tad_bg.421.a:0 "Raise national readiness."
 tad_bg.422.t:0 "Guatemala Reduces Patrol Activity"
 tad_bg.422.d:0 "Guatemalan units have temporarily reduced their presence near the Adjacency Line. The pause may be tactical, but it lowers the immediate risk of an accidental clash."
 tad_bg.422.a:0 "Use the breathing room."
 tad_bg.423.t:0 "Belize Accepts Quiet Talks"
 tad_bg.423.d:0 "Belmopan is willing to discuss practical de-escalation through the private channel."
 tad_bg.423.a:0 "Keep the channel narrow and serious."
 tad_bg.424.t:0 "Belize Demands OAS Participation"
 tad_bg.424.d:0 "Belize will discuss de-escalation only with regional observers present."
 tad_bg.424.a:0 "Consider a formal meeting."
 tad_bg.425.t:0 "Belize Rejects the Backchannel"
 tad_bg.425.d:0 "Belmopan has refused private talks and publicly restated that it will not negotiate under pressure."
 tad_bg.425.a:0 "Then public pressure will continue."
 tad_bg.440.t:0 "A Country Prepared to Endure"
 tad_bg.440.d:0 "The National Survival Plan links the BDF, civil authorities, regional partners and local communities. Belize remains outnumbered, but it is no longer unprepared."
 tad_bg.440.a:0 "We will remain sovereign."
 tad_bg.450.t:0 "The Petén Network Is Ready"
 tad_bg.450.d:0 "Road repairs, transport requisitions and forward stores have created a system capable of sustaining a much larger force near Belize. The logistical barrier has not disappeared, but it no longer guarantees delay."
 tad_bg.450.a:0 "The army now has options."
