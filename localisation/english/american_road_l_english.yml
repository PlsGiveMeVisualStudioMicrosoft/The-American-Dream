 american_road.1.t:0 "Truck Attack in New Orleans"
 american_road.1.d:0 "At 3AM local time, An Islamic Terrorist, sympathetic to ISIS, rammed his car down the street, trough Bourbon Street. The street was hosting parties and other New Years celebrations, making the total injury count we know of so far, at 52. The FBI puts the death count at 14 so far.\n\nThe FBI is confident that the attacker, Jabbar Shamsud-Din Bahar acted alone, and without foreign help. Investigators also found two pipe bombs inside coolers on Bourbon Street a few blocks from the attack. The devices were rigged for detonation, and connected to a wireless remote found in the truck.\n\n[american_road.1.tt]"
 american_road.1.tt:0 "[?USA.civil_war|0]"
 american_road.1.a:0 "The Nation Grieves"
 american_road.1.a_tt:0 "§RChaos +1§! (now [?USA.civil_war|0])"

 american_road.2.t:0 "The Munich Security Conference Speech"
 american_road.2.d:0 "On February 14th, Vice President JD Vance addressed the Munich Security Conference, delivering a sharp critique of European governments over issues of free speech, immigration, and domestic politics. His remarks caused controversy among America's allies, with some viewing them as a challenge to the foundations of the transatlantic alliance, while others celebrated the speech as a defense of national sovereignty and conservative values.\n\n[american_road.2.tt]"
 american_road.2.tt:0 "[?USA.aproval_rate|0]\n[?USA.civil_war|0]"
 american_road.2.a:0 "We stand behind that"
 american_road.2.a_tt:0 "§GApproval +1§! (now [?USA.aproval_rate|0]%)\n§RChaos +2§! (now [?USA.civil_war|0])"
 american_road.2.b:0 "EU is kinda cool actually"
 american_road.2.b_tt:0 "§RApproval -5§! (now [?USA.aproval_rate|0]%)\n§GChaos -5§! (now [?USA.civil_war|0])"

 american_road.3.t:0 "Elon's DOGE cuts over 6,000 jobs at IRS"
 american_road.3.d:0 "The Internal Revenue Service, better known as the IRS, is cutting more than 6,000 jobs in the middle of a busy tax season.\nThe cuts are part of a widespread downsizing throughout the federal government being led by Elon Musk's deputies at the informal \"Department of Government Efficiency.\"\nLanding right in the middle of tax season, the job cuts are expected to make it harder for taxpayers to get questions answered and for the government to collect all the money it's owed. \n\n[american_road.3.tt]"
 american_road.3.tt:0 "[?USA.aproval_rate|0][?USA.civil_war|0]"
 american_road.3.a:0 "Elon I <3 you"
 american_road.3.a_tt:0 "§GApproval +1§! (now [?USA.aproval_rate|0]%)\n§RChaos +2§! (now [?USA.civil_war|0])"
 american_road.3.b:0 "Wait, Chill..."
 american_road.3.b_tt:0 "§RApproval -3§! (now [?USA.aproval_rate|0]%)\n§GChaos -2§! (now [?USA.civil_war|0])"

 american_road.4.t:0 "New Russian Ambassador"
 american_road.4.d:0 "On 27 February 2025, he led the Russian delegation in talks between the United States and Russia that took place in Istanbul, Turkey, which were a continuation of the earlier negotiations in Riyadh, Saudi Arabia. You discussed the restoration of Russia–United States relations, including by removing restrictions on their embassies. At the meeting the U.S. delegation gave a note to the Russian side accepting Darchiev's appointment as Russian Ambassador to the United States.\n\n\n[american_road.4.tt]"
 american_road.4.tt:0 "[?USA.aproval_rate|0]"
 american_road.4.a:0 "Yay!"
 american_road.4.a_tt:0 "§GApproval +1§! (now [?USA.aproval_rate|0]%)"

 american_road.5.t:0 "Minab school attack"
 american_road.5.d:0 "On 28 February 2026, the first day of the 2026 Iran war, the Shajareh Tayyebeh Elementary School in Minab, Hormozgan province, southern Iran, was destroyed by a missile strike. \nAccording to witness accounts corroborated by satellite-based analyses, the area of the school was hit by multiple strikes. The roof of the school collapsed on students. 156 civilians were killed, including 120 schoolchildren.\n\n\n[american_road.5.tt]"
 american_road.5.tt:0 "[?USA.aproval_rate|0]"
 american_road.5.a:0 "Keep up the Pressure!"
 american_road.5.a_tt:0 "§RApproval -13§! (now [?USA.aproval_rate|0]%)\n§RChaos +1§! (now [?USA.civil_war|0])"

 american_road.6.t:0 "Please, come to Greenland!"
 american_road.6.d:0 "\"You know, Mark, we need that for international security, not just security - international - we have a lot of our favorite players cruising around the coast, and we have to be careful,\"\n\nOn March 13 Our Great leader Trump expressed his continued interest in the Ice sheet, commonly know as Greenland. As the No New Wars candidate, this polled badly, with a staggering 78% disapproval, but went down even worse in Europe, where Denmark has been weirdly overprotective over their colony.\n\n\n\n[american_road.6.tt]"
 american_road.6.tt:0 "[?USA.aproval_rate|0][?USA.civil_war|0]"
 american_road.6.a:0 "MARK! GIVE ME GREENLAND!!! I BEG!!"
 american_road.6.a_tt:0 "§RApproval -7§! (now [?USA.aproval_rate|0]%)\n§RChaos +6§! (now [?USA.civil_war|0])"

 american_road.7.t:0 "Hello? Is this Putin?"
 american_road.7.d:0 "President Donald Trump held a high-stakes call with Vladimir Putin on Tuesday as you seek a ceasefire between Russia and Ukraine.\n\nPutin supports Trump's idea for a mutual pause on energy infrastructure attacks, but did not include a commitment to the 30-day truce accepted by Ukraine last week despite Trump's optimism in recent days that Moscow would go along.\n\n[american_road.7.tt]"
 american_road.7.tt:0 "[?USA.aproval_rate|0][?USA.civil_war|0]"
 american_road.7.a:0 "Road to peace?"
 american_road.7.a_tt:0 "§GApproval +3§! (now [?USA.aproval_rate|0]%)\n§RChaos +1§! (now [?USA.civil_war|0])"

 american_road.8.t:0 "Bodies of missing aid workers found in Gaza ‘mass grave’ following Israeli attacks"
 american_road.8.d:0 "IDF spokesman Lt. Col. Nadav Shoshani insisted the IDF “did not randomly attack an ambulance” and claimed without evidence that nine “terrorists” had been killed.\n\nAid organizations and the UN have expressed outrage over the attacks, which the International Federation of Red Cross and Red Crescent said were the “single most deadly” for IFRC workers in almost a decade.\n\n[american_road.8.tt]"
