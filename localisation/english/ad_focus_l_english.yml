l_english:
  ### The American Dream - focus names (all four chapters)
 USA_state_of_the_union:0 "State of the Union"
 USA_state_of_the_union_desc:0 "Day one. The inauguration. American carnage is over — the Golden Age begins."
 USA_the_golden_age:0 "The Golden Age Begins"
 USA_the_golden_age_desc:0 "A blizzard of executive orders. DOGE is unleashed on the federal government."
 USA_drain_the_swamp:0 "Drain the Swamp (Again)"
 USA_drain_the_swamp_desc:0 "Mass layoffs, gutted agencies, the chainsaw in full swing."
 USA_the_enemy_within:0 "The Enemy Within"
 USA_the_enemy_within_desc:0 "Declare war on the press, the universities and the 'deep state.'"
 USA_purge_the_bureaucracy:0 "Purge the Bureaucracy"
 USA_purge_the_bureaucracy_desc:0 "Replace career officials with loyalists. Schedule F, everywhere."
 USA_law_and_order:0 "Law & Order"
 USA_law_and_order_desc:0 "Marines and the National Guard to the Democratic cities."
 USA_big_beautiful_bill:0 "The Big Beautiful Bill"
 USA_big_beautiful_bill_desc:0 "Sign the signature tax-and-spending bill. The deficit can wait."
 USA_redraw_the_map:0 "Redraw the Map"
 USA_redraw_the_map_desc:0 "Mid-decade redistricting. Draw the districts that draw themselves."
 USA_consolidate_the_party:0 "Consolidate the Party"
 USA_consolidate_the_party_desc:0 "Endorsements, primaries, purges. There is only one faction now."
 USA_the_2026_machine:0 "The 2026 War Machine"
 USA_the_2026_machine_desc:0 "Build the apparatus to win the midterms — by any means."
 USA_loyalty_above_all:0 "Loyalty Above All"
 USA_loyalty_above_all_desc:0 "The last independent officials are gone. Loyalty is the only qualification."
 USA_one_year_in:0 "One Year In"
 USA_one_year_in_desc:0 "The anniversary address. The base roars; the country splits down the middle."
 USA_manufacture_consent:0 "Manufacture Consent"
 USA_manufacture_consent_desc:0 "Lean on the networks, the FCC, the platforms. Control the story."
 USA_weaponize_the_doj:0 "Weaponize the DOJ"
 USA_weaponize_the_doj_desc:0 "The Justice Department becomes a weapon aimed at enemies of the President."
 USA_october_surprise:0 "The October Surprise Factory"
 USA_october_surprise_desc:0 "Pre-position the narratives that will 'save' the midterms."
 USA_stir_the_base:0 "Stir the Base"
 USA_stir_the_base_desc:0 "Rallies, grievance, fear. Keep the faithful at a boil."
 USA_summer_of_discontent:0 "Summer of Discontent"
 USA_summer_of_discontent_desc:0 "Prices bite, protests swell, approval sags. The last quiet summer."
 USA_the_integrity_pivot:0 "The Integrity Pivot"
 USA_the_integrity_pivot_desc:0 "Announce a nationwide 'election integrity' operation. The pivot point."
 USA_question_the_count:0 "Question the Count"
 USA_question_the_count_desc:0 "Pre-declare the coming midterms rigged — by the Democrats, of course."
 USA_secure_the_vote:0 "Secure the Vote"
 USA_secure_the_vote_desc:0 "The cheat begins. 'Integrity' forces move on the swing precincts."
 USA_stolen_midterms:0 "The Stolen Midterms"
 USA_stolen_midterms_desc:0 "Against every count, Congress is 'held.' The numbers are declared fake."
 USA_govern_by_decree:0 "Govern by Decree"
 USA_govern_by_decree_desc:0 "Legitimacy is gone; rule by emergency proclamation instead."
 USA_iran_ultimatum:0 "The Iran Ultimatum"
 USA_iran_ultimatum_desc:0 "Nothing unites like a war. Deliver Tehran an impossible ultimatum."
 USA_wartime_president:0 "Wartime President"
 USA_wartime_president_desc:0 "Full war footing. Wrap the collapsing presidency in the flag."
 USA_the_home_front:0 "The Home Front"
 USA_the_home_front_desc:0 "Anti-war protests meet riot lines. The home front is a front."
 USA_the_blame_game:0 "The Blame Game"
 USA_the_blame_game_desc:0 "As Iran goes wrong, find someone to blame. Generals. Democrats. Migrants."
 USA_martial_law:0 "Martial Law"
 USA_martial_law_desc:0 "Suspend the inconvenient. Troops in the streets of every major city."
 USA_the_rout_fallout:0 "The Rout Fallout"
 USA_the_rout_fallout_desc:0 "The army is broken in the Zagros. The blame lands on the President's desk."
 USA_purge_the_pentagon:0 "Purge of the Pentagon"
 USA_purge_the_pentagon_desc:0 "Fire the brass who lost the war. Promote the ones who salute hardest."
 USA_emergency_econ_powers:0 "Emergency Economic Powers"
 USA_emergency_econ_powers_desc:0 "Seize the banks, freeze the prices, nationalize the panic."
 USA_the_28th_month:0 "The 28th Month"
 USA_the_28th_month_desc:0 "Float the unthinkable through friendly media: why should he have to leave?"
 USA_test_the_waters:0 "Test the Waters"
 USA_test_the_waters_desc:0 "Rallies chant 'twelve more years.' Measure how far it can be pushed."
 USA_reinterpret_the_22nd:0 "Reinterpret the 22nd"
 USA_reinterpret_the_22nd_desc:0 "Loyalist lawyers 'discover' the 22nd Amendment doesn't mean what it says."
 USA_pack_the_courts:0 "Pack the Courts"
 USA_pack_the_courts_desc:0 "Reshape the bench until the ruling you need is the ruling you get."
 USA_declare_candidacy:0 "Declare Candidacy"
 USA_declare_candidacy_desc:0 "He's running again. The Constitution is a suggestion; the ballot is a formality."
 USA_the_newsom_threat:0 "The Newsom Threat"
 USA_the_newsom_threat_desc:0 "The Democrats nominate Gavin Newsom of California. The West has a champion."
 USA_build_the_machine:0 "Build the Machine"
 USA_build_the_machine_desc:0 "Stand up the nationwide 'integrity force.' Every precinct, watched."
 USA_suppress_the_vote:0 "Suppress the Vote"
 USA_suppress_the_vote_desc:0 "Purge the rolls, flood the zone, drown the opposition's turnout."
 USA_the_final_campaign:0 "The Final Campaign"
 USA_the_final_campaign_desc:0 "A ruined, rationed, furious nation is dragged to the polls."
 USA_election_eve:0 "Election Eve"
 USA_election_eve_desc:0 "Both Americas swear they will win — no matter what the other counts."
 USA_steal_the_election:0 "Steal the Election"
 USA_steal_the_election_desc:0 "Election day. The machine runs full-tilt. The result is decided in advance."
 USA_declare_victory_collapse:0 "Declare Victory — THE COLLAPSE"
 USA_declare_victory_collapse_desc:0 "The result is announced. California and the West Coast refuse it. The Union dissolves. The American Dream ends."
 USA_bring_back_manufacturing:0 "Bring Back Manufacturing"
 USA_bring_back_manufacturing_desc:0 "Tariff the world and the factories come home. That's the theory."
 USA_tarrifs_on_china:0 "Tarrifs on China"
 USA_tarrifs_on_china_desc:0 "Open the trade war with Beijing. 10, then 60, then 145 percent."
 USA_liberation_day:0 "Liberation Day"
 USA_liberation_day_desc:0 "The reciprocal tariff wall goes up. The markets fall down."
 USA_tarrif_the_world:0 "Tarrif the World"
 USA_tarrif_the_world_desc:0 "Go it alone — tariffs on friend and foe alike."
 USA_befriend_europe:0 "Befriend Europe"
 USA_befriend_europe_desc:0 "Cut Europe a deal to gang up on China instead."
 USA_steel_aluminum_50:0 "Steel & Aluminum 50%"
 USA_steel_aluminum_50_desc:0 "Double the metal tariffs. Premiums explode overnight."
 USA_the_manufacturing_mirage:0 "The Manufacturing Mirage"
 USA_the_manufacturing_mirage_desc:0 "Declare the boom. The market's high; nobody reads the fine print."
 USA_the_fed_feud:0 "The Fed Feud"
 USA_the_fed_feud_desc:0 "Demand rate cuts. Threaten the Chair. Question the Fed's very existence."
 USA_prices_creep_up:0 "Prices Creep Up"
 USA_prices_creep_up_desc:0 "The tariffs reach the shelves. Inflation quietly comes back to life."
 USA_the_grocery_crisis:0 "The Grocery Crisis"
 USA_the_grocery_crisis_desc:0 "Food and energy bite. 'It's the prices, stupid' becomes the whole story."
 USA_print_the_difference:0 "Print the Difference"
 USA_print_the_difference_desc:0 "The deficit is unpayable, so it is printed. The presses run hot."
 USA_the_oil_shock:0 "The Oil Shock"
 USA_the_oil_shock_desc:0 "Hormuz closes. Gas hits ten dollars a gallon by breakfast."
 USA_double_digit_inflation:0 "Double-Digit Inflation"
 USA_double_digit_inflation_desc:0 "Prices no longer creep — they sprint. The paycheck can't keep up."
 USA_wage_and_price_controls:0 "Wage & Price Controls"
 USA_wage_and_price_controls_desc:0 "Freeze it all by decree. The shelves empty in a week."
 USA_hyperinflation:0 "Hyperinflation"
 USA_hyperinflation_desc:0 "The dollar goes into freefall. A barter economy grows in the ruins."
 USA_the_new_dollar:0 "The New Dollar"
 USA_the_new_dollar_desc:0 "'Currency reform.' Three zeroes vanish and so do everyone's savings."
 USA_rationing:0 "Rationing"
 USA_rationing_desc:0 "Federal ration cards. Breadlines under the golden billboards."
 USA_maximum_pressure:0 "Maximum Pressure (Again)"
 USA_maximum_pressure_desc:0 "Rip up the deal, reimpose the sanctions. Squeeze Tehran until it pops."
 USA_stand_with_israel:0 "Stand With Israel"
 USA_stand_with_israel_desc:0 "Back Jerusalem to the hilt, whatever comes next."
 USA_the_june_war:0 "The June War"
 USA_the_june_war_desc:0 "Israel opens with Rising Lion; American B-2s finish Fordow, Natanz, Isfahan."
 USA_bomb_iran:0 "Bomb Iran!"
 USA_bomb_iran_desc:0 "The strike order. 'Iran will never have a nuclear weapon.'"
 USA_reopen_the_straits:0 "Reopen The Straits"
 USA_reopen_the_straits_desc:0 "Blast the Strait of Hormuz back open. Oil flows; chaos ebbs."
 USA_fragile_ceasefire:0 "Fragile Ceasefire"
 USA_fragile_ceasefire_desc:0 "Twelve days and a truce. 'Obliterated,' says the President. We'll see."
 USA_the_nuclear_question:0 "The Nuclear Question"
 USA_the_nuclear_question_desc:0 "Did the strikes even work? Tehran is already digging new tunnels."
 USA_proxy_flareups:0 "Proxy Flare-ups"
 USA_proxy_flareups_desc:0 "Militias and drones harass American assets across the region."
 USA_gulf_incident:0 "The Gulf Incident"
 USA_gulf_incident_desc:0 "An 'incident' in the Gulf. The exact facts will never quite matter."
 USA_the_second_strike:0 "The Second Strike"
 USA_the_second_strike_desc:0 "Open war returns — bigger, and this time without an off-ramp."
 USA_boots_on_the_ground:0 "Boots on the Ground"
 USA_boots_on_the_ground_desc:0 "The invasion of Iran. The maps look easy. They always do."
 USA_the_hormuz_disaster:0 "The Hormuz Disaster"
 USA_the_hormuz_disaster_desc:0 "A carrier goes down. The Strait slams shut. The oil price detonates."
 USA_zagros_meat_grinder:0 "The Zagros Meat Grinder"
 USA_zagros_meat_grinder_desc:0 "The advance dies in the mountains. The casualty lists run for pages."
 USA_coalition_collapses:0 "Coalition Collapses"
 USA_coalition_collapses_desc:0 "The allies quietly go home. America is alone in the mountains."
 USA_bring_the_troops_home:0 "Bring the Troops Home"
 USA_bring_the_troops_home_desc:0 "The humiliating exit. Radicalized veterans come home to a broken country."
 USA_blatant_steal:0 "Blatant Steal"
 USA_blatant_steal_desc:0 "Seize machines on camera. Dare anyone to stop it. Chaos, fast."
 USA_quiet_steal:0 "Quiet Steal"
 USA_quiet_steal_desc:0 "Purge rolls and 'lose' ballots in the dark. Slower, deniable."
 USA_brazen_fraud:0 "Brazen Fraud"
 USA_brazen_fraud_desc:0 "Declare victory before the votes are counted. The West Coast erupts."
 USA_quiet_rigging:0 "Quiet Rigging"
 USA_quiet_rigging_desc:0 "Rig it in the certification, in the courts, in the dark. It fools no one."
 USA_chapter_one_end:0 "One Year Done"
 USA_chapter_one_end_desc:0 "The anniversary passes. The base is roaring, the country is splitting, and the real fight - the midterms - is next. Turn the page."
 USA_chapter_two_end:0 "The Reckoning Begins"
 USA_chapter_two_end_desc:0 "The midterms are settled - one way or another. Now the desert calls. The Iran war moves to the center of everything. Turn the page."
 USA_chapter_three_end:0 "The War Is Lost"
 USA_chapter_three_end_desc:0 "The army is broken and the country knows it. All that is left is to hold power through one last, stolen election. Turn the page."
