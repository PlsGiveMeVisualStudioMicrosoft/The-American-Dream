l_english:
 BLZ_trust_in_icj:0 "Trust in the ICJ"
 BLZ_trust_in_icj_desc:0 "Commit Belize to a legal strategy that turns sovereignty and international legitimacy into strategic protection."
 BLZ_accept_cuban_internationalists:0 "Accept Cuban Internationalists"
 BLZ_accept_cuban_internationalists_desc:0 "A highly organised contingent available only with sufficient communist influence. Consumer goods: §Y+44%§! for 180 days."
 BLZ_accept_nicaraguan_volunteers:0 "Accept Nicaraguan Volunteers"
 BLZ_accept_nicaraguan_volunteers_desc:0 "Aggressive jungle fighters with political costs. Consumer goods: §Y+48%§! for 180 days."
 BLZ_appeal_caricom:0 "Appeal to CARICOM"
 BLZ_appeal_caricom_desc:0 "Ask Caribbean partners to turn diplomatic solidarity into practical security cooperation."
 BLZ_appeal_foreign_volunteers:0 "Appeal for Foreign Volunteers"
 BLZ_appeal_foreign_volunteers_desc:0 "Open carefully controlled channels for regional volunteers and professional contingents. Every formation will be four combat width and roughly one thousand personnel, but the economic price varies sharply."
 BLZ_belmopan_fortified:0 "Fortified Belmopan"
 BLZ_belmopan_fortified_desc:0 "Belmopan has been prepared as the political and military centre of national resistance."
 BLZ_call_diaspora:0 "Call Home the Belizean Diaspora"
 BLZ_call_diaspora_desc:0 "A four-width, approximately one-thousand-person formation with limited equipment. Consumer goods: §Y+10%§! for 180 days."
 BLZ_clean_procurement:0 "Clean Public Procurement"
 BLZ_clean_procurement_desc:0 "Transparent purchasing is essential for a country with little fiscal room for corruption."
 BLZ_coastal_surveillance:0 "Coastal Surveillance Network"
 BLZ_coastal_surveillance_desc:0 "Protect coastal routes, fisheries and ports with patrol craft, observation posts and local reporting."
 BLZ_contract_colombia:0 "Colombian PMC Contract"
 BLZ_contract_colombia_desc:0 "A fully equipped, combat-experienced professional battlegroup is consuming an extraordinary share of Belizean civilian resources."
 BLZ_contract_colombian_pmc:0 "Contract Colombian Military Professionals"
 BLZ_contract_colombian_pmc_desc:0 "A veteran, fully equipped battlegroup and the strongest available contingent. Consumer goods: §R+90%§! for 120 days."
 BLZ_contract_cuba:0 "Cuban Internationalist Mission"
 BLZ_contract_cuba_desc:0 "Cuban assistance comes with substantial economic and political obligations."
 BLZ_contract_diaspora:0 "Diaspora Mobilisation Contract"
 BLZ_contract_diaspora_desc:0 "Returning Belizeans require transport, accommodation and rapid training."
 BLZ_contract_dominican:0 "Dominican Security Contract"
 BLZ_contract_dominican_desc:0 "A Dominican security contingent is being maintained across the Caribbean supply route."
 BLZ_contract_guyana:0 "Guyanese Volunteer Support"
 BLZ_contract_guyana_desc:0 "A jungle-trained Guyanese company is being sustained in Belize."
 BLZ_contract_honduras:0 "Honduran Recruitment Programme"
 BLZ_contract_honduras_desc:0 "Belize must equip, train and administer volunteers recruited through nearby Honduran networks."
 BLZ_contract_jamaica:0 "Jamaican Volunteer Support"
 BLZ_contract_jamaica_desc:0 "The Jamaican contingent is easy to integrate, but its wages and logistical support still burden the economy."
 BLZ_contract_mexico:0 "Yucatán Recruitment Network"
 BLZ_contract_mexico_desc:0 "Clandestine recruitment and procurement networks demand large payments and generate corruption risks."
 BLZ_contract_nicaragua:0 "Nicaraguan Volunteer Mission"
 BLZ_contract_nicaragua_desc:0 "The Nicaraguan contingent is useful in the jungle but diplomatically controversial and costly to sustain."
 BLZ_contract_salvador:0 "Salvadoran Veteran Contract"
 BLZ_contract_salvador_desc:0 "Experienced Salvadoran personnel require high wages, transport and political guarantees."
 BLZ_contract_trinidad:0 "Trinidad Maritime Security Contract"
 BLZ_contract_trinidad_desc:0 "Transporting and maintaining the Trinidadian security contingent consumes civilian shipping and budget capacity."
 BLZ_crisis_readiness:0 "The Imminent Crisis"
 BLZ_crisis_readiness_desc:0 "Civil authorities, the BDF and local volunteers are preparing for the possibility that the territorial dispute may become a military emergency."
 BLZ_democratic_resilience:0 "Democratic Resilience"
 BLZ_democratic_resilience_desc:0 "Complete institutional reforms that preserve stability while finishing the work of decolonisation."
 BLZ_develop_belmopan:0 "Develop Belmopan"
 BLZ_develop_belmopan_desc:0 "Turn the inland capital into a functional administrative and economic centre rather than a collection of government buildings."
 BLZ_diversify_beyond_tourism:0 "Diversify Beyond Tourism"
 BLZ_diversify_beyond_tourism_desc:0 "A sovereign country cannot allow every external shock to threaten its entire economy."
 BLZ_emergency_mobilization:0 "Emergency BDF Mobilisation"
 BLZ_emergency_mobilization_desc:0 "Release reserve equipment and activate the Total Defence Plan."
 BLZ_expand_adjacency_patrols:0 "Expand Belizean Patrols"
 BLZ_expand_adjacency_patrols_desc:0 "Improve readiness at the cost of higher tension. Guatemala will choose how to answer."
 BLZ_expand_volunteer_battalion:0 "Expand the Volunteer Battalion"
 BLZ_expand_volunteer_battalion_desc:0 "Increase the pool of trained citizens available for emergencies without pretending Belize can field a mass army."
 BLZ_foreign_volunteer_network:0 "Foreign Volunteer Network"
 BLZ_foreign_volunteer_network_desc:0 "Belize has opened regional recruitment, transport and contracting channels. The additional manpower is valuable, but integrating foreign formations is politically and economically costly."
 BLZ_fund_icj_case:0 "Fund Additional ICJ Research"
 BLZ_fund_icj_case_desc:0 "Expand legal, archival and cartographic work while increasing international support."
 BLZ_hold_until_world_listens:0 "Hold Until the World Listens"
 BLZ_hold_until_world_listens_desc:0 "Belize does not need to conquer Guatemala. It needs to keep its government alive long enough for the political cost of aggression to become unbearable."
 BLZ_homeland_defence_doctrine:0 "Defence of the Homeland"
 BLZ_homeland_defence_doctrine_desc:0 "Belize cannot win a prolonged offensive war against Guatemala. Its doctrine therefore centres on prepared positions, jungle mobility and making every kilometre prohibitively expensive."
 BLZ_internationalise_dispute:0 "Internationalise the Dispute"
 BLZ_internationalise_dispute_desc:0 "Belize’s strongest strategic asset is the legitimacy of its sovereignty and the support of regional institutions."
 BLZ_invite_oas_verification:0 "Invite OAS Verification"
 BLZ_invite_oas_verification_desc:0 "Request neutral verification and notify Guatemala that the incident is being internationalised."
 BLZ_jungle_defence_network:0 "Jungle Defence Network"
 BLZ_jungle_defence_network_desc:0 "Local knowledge, dispersed supply caches and jungle training allow Belizean units to survive and manoeuvre with limited resources."
 BLZ_jungle_defence_training:0 "Train for Jungle Defence"
 BLZ_jungle_defence_training_desc:0 "Every territorial and regular unit must learn how to disperse, entrench and counterattack in local terrain."
 BLZ_jungle_warfare_school:0 "Jungle Warfare School"
 BLZ_jungle_warfare_school_desc:0 "Institutionalise the BDF’s greatest comparative advantage: operating in difficult local terrain with small units."
 BLZ_last_line_of_defence:0 "The Last Line of Defence"
 BLZ_last_line_of_defence_desc:0 "Belize has no strategic depth to waste. The armed forces are ordered to preserve the government, hold Belmopan and survive until international pressure forces a ceasefire."
 BLZ_local_government_compact:0 "A Local Government Compact"
 BLZ_local_government_compact_desc:0 "Give municipalities and district authorities the infrastructure and authority needed to govern beyond the two principal cities."
 BLZ_modernise_belize_city:0 "Modernise Belize City"
 BLZ_modernise_belize_city_desc:0 "Improve the country’s largest urban centre, transport hub and commercial heart."
 BLZ_open_yucatan_network:0 "Open the Yucatán Recruitment Network"
 BLZ_open_yucatan_network_desc:0 "Well-armed contractors recruited through clandestine Mexican networks. Consumer goods: §Y+56%§! for 180 days."
 BLZ_prepare_belmopan:0 "Prepare Belmopan"
 BLZ_prepare_belmopan_desc:0 "Fortify the capital, improve its approaches and prepare continuity-of-government sites."
 BLZ_recruit_dominican_volunteers:0 "Recruit Dominican Security Volunteers"
 BLZ_recruit_dominican_volunteers_desc:0 "Useful for protecting cities and roads. Consumer goods: §Y+34%§! for 180 days."
 BLZ_recruit_honduran_volunteers:0 "Recruit Honduran Volunteers"
 BLZ_recruit_honduran_volunteers_desc:0 "Nearby manpower, but poorly integrated and only partly equipped. Consumer goods: §Y+30%§! for 180 days."
 BLZ_recruit_salvadoran_veterans:0 "Recruit Salvadoran Veterans"
 BLZ_recruit_salvadoran_veterans_desc:0 "Experienced urban defenders with weaker jungle performance. Consumer goods: §Y+38%§! for 180 days."
 BLZ_regional_security_network:0 "A Regional Security Network"
 BLZ_regional_security_network_desc:0 "Build durable channels for intelligence, transport, training and emergency assistance."
 BLZ_remind_haiti_of_our_aid:0 "Remind Haiti of Our Aid"
 BLZ_remind_haiti_of_our_aid_desc:0 "If Port-au-Prince owes Belize a debt, quietly ensure that its government remembers the agreement."
 BLZ_request_guyanese_volunteers:0 "Request Guyanese Volunteers"
 BLZ_request_guyanese_volunteers_desc:0 "Jungle and marsh specialists. Consumer goods: §Y+22%§! for 180 days."
 BLZ_request_jamaican_volunteers:0 "Request Jamaican Volunteers"
 BLZ_request_jamaican_volunteers_desc:0 "Reliable English-speaking defenders with strong jungle performance. Consumer goods: §Y+16%§! for 180 days."
 BLZ_request_trinidad_security_group:0 "Request a Trinidad Security Group"
 BLZ_request_trinidad_security_group_desc:0 "A disciplined security formation suitable for urban and coastal defence. Consumer goods: §Y+24%§! for 180 days."
 BLZ_sovereignty_campaign:0 "National Sovereignty Campaign"
 BLZ_sovereignty_campaign_desc:0 "Raise public confidence, but signal that Belize will not quietly absorb pressure."
 BLZ_stockpile_every_rifle:0 "Stockpile Every Rifle"
 BLZ_stockpile_every_rifle_desc:0 "Gather serviceable weapons, ammunition and support equipment before the border closes."
 BLZ_stockpile_support_equipment:0 "Stockpile Support Equipment"
 BLZ_stockpile_support_equipment_desc:0 "Radios, engineering stores and medical supplies matter more to a small force than prestige weapons."
 BLZ_strengthen_public_service:0 "Strengthen the Public Service"
 BLZ_strengthen_public_service_desc:0 "Professionalise the small civil service and reduce the state’s dependence on personal networks."
 BLZ_total_defence_focus:0 "Activate Total Defence"
 BLZ_total_defence_focus_desc:0 "Integrate the BDF, territorial groups, police, local government and civil infrastructure into a national survival plan."
 BLZ_warn_people_imminent_crisis:0 "Warn the People of the Imminent Crisis"
 BLZ_warn_people_imminent_crisis_desc:0 "At forty points of tension, silence would become negligence. Inform the public, activate local defence plans and raise two territorial groups."
 GUA_accept_oas_verification:0 "Accept OAS Verification"
 GUA_accept_oas_verification_desc:0 "Temporarily lower tension and demonstrate restraint."
 GUA_border_incidents_doctrine:0 "A Doctrine of Border Incidents"
 GUA_border_incidents_doctrine_desc:0 "Use controlled confrontations to test Belizean resolve and normalise Guatemalan pressure."
 GUA_border_pressure_campaign:0 "Border Pressure Campaign"
 GUA_border_pressure_campaign_desc:0 "The government is combining patrols, nationalist mobilisation and military readiness to force concessions from Belmopan."
 GUA_build_forward_supply_depots:0 "Complete Forward Supply Depots"
 GUA_build_forward_supply_depots_desc:0 "Remove the remaining Petén logistics penalty and make a sustained offensive possible."
 GUA_capital_modernisation:0 "Modernise the Capital"
 GUA_capital_modernisation_desc:0 "Concentrate advanced administration, industry and research in the Guatemala City metropolitan area."
 GUA_deploy_kaibiles_to_border:0 "Deploy Kaibiles to the Border"
 GUA_deploy_kaibiles_to_border_desc:0 "Use elite troops for intimidation and high-risk patrol activity."
 GUA_eastern_dry_corridor:0 "The Eastern Dry Corridor"
 GUA_eastern_dry_corridor_desc:0 "Address weak infrastructure and recurring hardship in eastern Guatemala."
 GUA_enforce_historic_claim:0 "Enforce the Historic Claim"
 GUA_enforce_historic_claim_desc:0 "Issue the ultimatum. If Belize refuses, Guatemala will be prepared to use force."
 GUA_escalation_fatigue:0 "Escalation Fatigue"
 GUA_escalation_fatigue_desc:0 "A war that was expected to be short has become politically and economically expensive."
 GUA_expand_peten_patrol_focus:0 "Expand Petén Patrols"
 GUA_expand_peten_patrol_focus_desc:0 "Increase the regular military presence close to the Adjacency Zone."
 GUA_expand_peten_patrols:0 "Expand Petén Patrols"
 GUA_expand_peten_patrols_desc:0 "Increase military pressure. Belize will receive an immediate warning and choose a response."
 GUA_forward_supply_depots:0 "Forward Supply Depots"
 GUA_forward_supply_depots_desc:0 "Build the infrastructure required to convert numerical superiority into sustained combat power."
 GUA_forward_supply_network:0 "Forward Supply Network"
 GUA_forward_supply_network_desc:0 "Forward depots and transport units now allow Guatemala to maintain a larger force in Petén and the Adjacency Zone."
 GUA_fund_icj_memorial_decision:0 "Fund the Guatemalan ICJ Case"
 GUA_fund_icj_memorial_decision_desc:0 "Improve claim momentum through legal and historical research."
 GUA_integrate_national_market:0 "Integrate the National Market"
 GUA_integrate_national_market_desc:0 "Link the seven strategic regions of the country into a more coherent economy."
 GUA_integrated_border_task_forces:0 "Integrated Border Task Forces"
 GUA_integrated_border_task_forces_desc:0 "Coordinate brigades, Kaibiles, police and civil agencies along Guatemala’s borders."
 GUA_issue_belize_ultimatum:0 "Issue an Ultimatum to Belize"
 GUA_issue_belize_ultimatum_desc:0 "Demand negotiations under military pressure. Refusal creates the path to war."
 GUA_izabal_ports:0 "Expand the Izabal Ports"
 GUA_izabal_ports_desc:0 "Develop Guatemala’s Caribbean gateway and improve access to Puerto Barrios."
 GUA_legal_offensive:0 "A Legal Offensive"
 GUA_legal_offensive_desc:0 "Pursue the claim through archives, international law and diplomatic pressure."
 GUA_map_the_national_inequality:0 "Map National Inequality"
 GUA_map_the_national_inequality_desc:0 "Guatemala is not one homogeneous state. Development policy must recognise the radically different needs of Petén, the highlands, the capital and both coasts."
 GUA_militarise_adjacency_zone:0 "Militarise the Adjacency Zone"
 GUA_militarise_adjacency_zone_desc:0 "Turn patrol activity into continuous military pressure on Belize."
 GUA_mountain_warfare_command:0 "Mountain Warfare Command"
 GUA_mountain_warfare_command_desc:0 "Preserve Guatemala’s specialised capacity for operations in mountains and difficult terrain."
 GUA_oas_diplomacy:0 "Work Through the OAS"
 GUA_oas_diplomacy_desc:0 "Use regional institutions to manage incidents and defend Guatemala’s legal position."
 GUA_operation_national_integrity:0 "Operation National Integrity"
 GUA_operation_national_integrity_desc:0 "Prepare an ultimatum and operational plan once political tension and military pressure are sufficient."
 GUA_pacific_export_corridor:0 "Pacific Export Corridor"
 GUA_pacific_export_corridor_desc:0 "Connect productive southern regions to modern port infrastructure."
 GUA_peten_logistical_bottleneck:0 "The Petén Logistical Bottleneck"
 GUA_peten_logistical_bottleneck_desc:0 "Guatemala possesses overwhelming numerical superiority, but roads, depots and transport capacity in Petén cannot immediately sustain the entire army against Belize."
 GUA_peten_logistics_corps:0 "Petén Logistics Corps"
 GUA_peten_logistics_corps_desc:0 "Dedicated transport and engineering units can reduce the greatest obstacle to a campaign against Belize."
 GUA_peten_logistics_improved:0 "Improved Petén Logistics"
 GUA_peten_logistics_improved_desc:0 "Road works and military transport have reduced, but not eliminated, the logistical cost of concentrating forces near Belize."
 GUA_peten_roads:0 "Roads into Petén"
 GUA_peten_roads_desc:0 "Improve the sparse northern road network for civilians, state administration and military logistics."
 GUA_professional_armed_forces_focus:0 "Professional Armed Forces"
 GUA_professional_armed_forces_focus_desc:0 "Build a more coherent force while retaining the capabilities developed through decades of internal and border operations."
 GUA_public_claim_campaign:0 "Public Campaign for the Claim"
 GUA_public_claim_campaign_desc:0 "Increase domestic support and tension through nationalist mobilisation."
 GUA_verapaces_social_investment:0 "Invest in the Verapaces"
 GUA_verapaces_social_investment_desc:0 "Expand services and formal employment in a region marked by rural poverty and difficult terrain."
 GUA_western_highlands_agriculture:0 "Western Highlands Agriculture"
 GUA_western_highlands_agriculture_desc:0 "Support processing, roads and rural investment in the densely populated western highlands."
 HAI_request_belizean_assistance:0 "Request Belizean Assistance"
 HAI_request_belizean_assistance_desc:0 "Once the Haitian crisis reaches §Y25 escalation§!, Haiti may ask peaceful Belize for weapons or a BDF security detachment. Belize–Guatemala tension does not restrict this request, and the Haitian AI will request aid automatically."
 TAD_BG_dispute_category:0 "The Belize–Guatemala Differendum — Tension: §R[?BLZ.BLZ_GUA_tension|0]§!/100"
 TAD_BG_dispute_category_desc:0 "§HTENSION:§! §Y[?BLZ.BLZ_GUA_tension|0]§!/100\n\n§HBelize§!\nInternational Support: §Y[?BLZ.BLZ_international_support|0]§!\nBorder Readiness: §Y[?BLZ.BLZ_border_readiness|0]§!\nPublic Confidence: §Y[?BLZ.BLZ_public_confidence|0]§!\n\n§HGuatemala§!\nClaim Momentum: §Y[?GUA.GUA_claim_momentum|0]§!\nMilitary Pressure: §Y[?GUA.GUA_military_pressure|0]§!\nDomestic Support: §Y[?GUA.GUA_domestic_support|0]§!\n\nMajor actions notify the opposing government and allow it to respond."
 BLZ_homeland_defence_state_modifier:0 "Prepared Homeland Defence"
 BLZ_homeland_defence_state_modifier_desc:0 "Belizean forces defending this state benefit from prepared positions, local knowledge and short internal supply lines."
 BLZ_belmopan_fortified_state_modifier:0 "Fortified Capital District"
 BLZ_belmopan_fortified_state_modifier_desc:0 "Belmopan has been prepared as the political and military centre of national resistance."
 BLZ_jungle_defence_state_modifier:0 "Jungle Defence Network"
 BLZ_jungle_defence_state_modifier_desc:0 "Dispersed caches, jungle tracks and local guides make this state exceptionally difficult to overrun."
 BLZ_total_defence_state_modifier:0 "Total Defence Zone"
 BLZ_total_defence_state_modifier_desc:0 "Military, police and civil infrastructure in this state have been integrated into a national survival plan."
 BLZ_last_line_state_modifier:0 "The Last Line"
 BLZ_last_line_state_modifier_desc:0 "Every usable road, bridge and settlement in this state has been incorporated into Belize's final defensive plan."
 GUA_peten_bottleneck_state_modifier:0 "Petén Logistical Bottleneck"
 GUA_peten_bottleneck_state_modifier_desc:0 "Poor roads, sparse depots and difficult terrain sharply limit the forces that can be sustained from this state."
 GUA_peten_improved_state_modifier:0 "Improved Petén Logistics"
 GUA_peten_improved_state_modifier_desc:0 "Road and depot improvements have reduced, but not eliminated, the logistical limits of Petén."
 GUA_peten_forward_network_state_modifier:0 "Petén Forward Supply Network"
 GUA_peten_forward_network_state_modifier_desc:0 "New depots and transport links allow larger formations to operate from Petén with greater efficiency."
 TAD_HAI_BLZ_assistance_category:0 "Caribbean Reciprocal Assistance"
 TAD_HAI_BLZ_assistance_category_desc:0 "At 25 Haitian escalation, Haiti can request Belizean assistance regardless of Belize–Guatemala tension. If Belize helps, Haiti later repays the exact type of aid through its own AI-controlled decision once Haiti is at peace and Belize is fighting Guatemala."
 belize_diaspora_infantry:0 "Belizean Diaspora Infantry"
 belize_diaspora_infantry_desc:0 "A compact light-infantry battalion designed for a four-width foreign or territorial formation."
 belize_territorial_infantry:0 "Belize Territorial Infantry"
 belize_territorial_infantry_desc:0 "A compact light-infantry battalion designed for a four-width foreign or territorial formation."
 colombian_pmc_infantry:0 "Colombian PMC Infantry"
 colombian_pmc_infantry_desc:0 "A compact light-infantry battalion designed for a four-width foreign or territorial formation."
 cuban_internationalist_infantry:0 "Cuban Internationalist Infantry"
 cuban_internationalist_infantry_desc:0 "A compact light-infantry battalion designed for a four-width foreign or territorial formation."
 dominican_security_infantry:0 "Dominican Security Infantry"
 dominican_security_infantry_desc:0 "A compact light-infantry battalion designed for a four-width foreign or territorial formation."
 guyanese_volunteer_infantry:0 "Guyanese Volunteer Infantry"
 guyanese_volunteer_infantry_desc:0 "A compact light-infantry battalion designed for a four-width foreign or territorial formation."
 honduran_volunteer_infantry:0 "Honduran Volunteer Infantry"
 honduran_volunteer_infantry_desc:0 "A compact light-infantry battalion designed for a four-width foreign or territorial formation."
 jamaican_volunteer_infantry:0 "Jamaican Volunteer Infantry"
 jamaican_volunteer_infantry_desc:0 "A compact light-infantry battalion designed for a four-width foreign or territorial formation."
 mexican_contract_infantry:0 "Mexican Contract Infantry"
 mexican_contract_infantry_desc:0 "A compact light-infantry battalion designed for a four-width foreign or territorial formation."
 nicaraguan_volunteer_infantry:0 "Nicaraguan Volunteer Infantry"
 nicaraguan_volunteer_infantry_desc:0 "A compact light-infantry battalion designed for a four-width foreign or territorial formation."
 salvadoran_veteran_infantry:0 "Salvadoran Veteran Infantry"
 salvadoran_veteran_infantry_desc:0 "A compact light-infantry battalion designed for a four-width foreign or territorial formation."
 tad_bg.1.a:0 "The Jewel must endure."
 tad_bg.1.d:0 "Belize enters 2025 with democratic stability, a vulnerable economy and an unresolved territorial dispute. Survival will depend on preparation rather than size."
 tad_bg.1.t:0 "Belize at a Crossroads"
 tad_bg.100.a:0 "Speak calmly and clearly."
 tad_bg.100.b:0 "Begin visible mobilisation."
 tad_bg.100.d:0 "Tension has reached forty. The government must warn the public and begin visible preparations without creating panic."
 tad_bg.100.t:0 "The Crisis Can No Longer Be Hidden"
 tad_bg.101.a:0 "Call our partners now."
 tad_bg.101.d:0 "Tension has reached seventy. Routine diplomacy is giving way to military calculations."
 tad_bg.101.t:0 "A Border Crisis"
 tad_bg.102.a:0 "Every road leads to the defence plan."
 tad_bg.102.d:0 "Tension has reached ninety. Belize must assume that an ultimatum or attack may be imminent."
 tad_bg.102.t:0 "On the Edge of War"
 tad_bg.110.a:0 "Hold the line."
 tad_bg.110.d:0 "The unequal war has begun. Belize cannot win by matching Guatemala division for division; it must preserve Belmopan, exploit the terrain and survive until international pressure becomes decisive."
 tad_bg.110.t:0 "Guatemala Attacks Belize"
 tad_bg.120.a:0 "Accept a ceasefire as a last resort."
 tad_bg.120.b:0 "Continue the campaign."
 tad_bg.120.d:0 "After eighteen months of fighting, Belize still controls both Belmopan and Belize City. International pressure has become severe, but a ceasefire would now be accepted only as an admission that the campaign can no longer be sustained."
 tad_bg.120.t:0 "A War of Exhaustion"
 tad_bg.130.a:0 "Record the movement."
 tad_bg.130.d:0 "Guatemala has taken another step to keep the claim active and test Belizean reactions."
 tad_bg.130.t:0 "Guatemalan Pressure Increases"
 tad_bg.131.a:0 "Alert our partners."
 tad_bg.131.d:0 "Additional Guatemalan military pressure has been detected near Belize."
 tad_bg.131.t:0 "New Guatemalan Military Activity"
 tad_bg.2.a:0 "The spring must become a state."
 tad_bg.2.d:0 "The reform government faces entrenched institutions, uneven development and a territorial claim that can be used to mobilise nationalism."
 tad_bg.2.t:0 "A Government Under Pressure"
 tad_bg.210.a:0 "Condemn the intervention and escalate."
 tad_bg.210.b:0 "Monitor the contingent without escalating."
 tad_bg.210.d:0 "Belize has received a new four-width foreign formation from belizean diaspora recruitment channels. The deployment increases the potential cost of a Guatemalan attack."
 tad_bg.210.t:0 "Belizean Diaspora Personnel Arrive in Belize"
