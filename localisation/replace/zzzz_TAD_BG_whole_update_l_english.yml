 tad_bg.218.a:0 "Condemn the intervention and escalate."
 tad_bg.218.b:0 "Monitor the contingent without escalating."
 tad_bg.218.d:0 "Belize has received a new four-width foreign formation from nicaraguan recruitment channels. The deployment increases the potential cost of a Guatemalan attack."
 tad_bg.218.t:0 "Nicaraguan Personnel Arrive in Belize"
 tad_bg.219.a:0 "Condemn the intervention and escalate."
 tad_bg.219.b:0 "Monitor the contingent without escalating."
 tad_bg.219.d:0 "Belize has received a new four-width foreign formation from mexican recruitment channels. The deployment increases the potential cost of a Guatemalan attack."
 tad_bg.219.t:0 "Mexican Personnel Arrive in Belize"
 tad_bg.220.a:0 "Condemn the intervention and escalate."
 tad_bg.220.b:0 "Monitor the contingent without escalating."
 tad_bg.220.d:0 "Belize has received a new four-width foreign formation from colombian pmc recruitment channels. The deployment increases the potential cost of a Guatemalan attack."
 tad_bg.220.t:0 "Colombian PMC Personnel Arrive in Belize"
 tad_bg.30.a:0 "Accept practical cooperation."
 tad_bg.30.b:0 "Reject the ambiguous offer."
 tad_bg.30.d:0 "Guatemala proposes practical cooperation near the Adjacency Zone without requiring either side to abandon its legal position."
 tad_bg.30.t:0 "Guatemala Offers Joint Development"
 tad_bg.300.a:0 "Send weapons and support equipment."
 tad_bg.300.b:0 "Deploy a BDF security detachment."
 tad_bg.300.c:0 "We cannot weaken our own defences."
 tad_bg.300.d:0 "Haiti requests assistance during its security crisis. Weapons would create an obligation to return weapons later; a BDF detachment would create an obligation to send a Haitian brigade if Belize is attacked."
 tad_bg.300.t:0 "A Call from Port-au-Prince"
 tad_bg.301.a:0 "Haiti will remember."
 tad_bg.301.d:0 "Belize has provided rifles and support equipment. Haiti has formally accepted an obligation to return material assistance in a future Belizean emergency."
 tad_bg.301.t:0 "Belize Sends Weapons"
 tad_bg.302.a:0 "This is Caribbean solidarity."
 tad_bg.302.d:0 "A Belizean security detachment has arrived in Port-au-Prince. Haiti has accepted a reciprocal obligation to provide troops if Belize later faces war and Haiti is at peace."
 tad_bg.302.t:0 "A BDF Detachment Arrives"
 tad_bg.303.a:0 "We must rely on others."
 tad_bg.303.d:0 "Belmopan argues that its own border situation prevents meaningful assistance."
 tad_bg.303.t:0 "Belize Declines"
 tad_bg.31.a:0 "Then the legal struggle continues."
 tad_bg.31.d:0 "Belize has rejected the proposal, arguing that joint arrangements could blur sovereignty."
 tad_bg.31.t:0 "Belize Rejects Joint Development"
 tad_bg.310.a:0 "They remembered."
 tad_bg.310.d:0 "Haiti is at peace and has dispatched the Haitian Solidarity Brigade: four infantry battalions, an engineering company, regular training and eighty-seven percent equipment."
 tad_bg.310.t:0 "Haiti Honours Its Promise"
 tad_bg.311.a:0 "Every rifle matters."
 tad_bg.311.d:0 "Haiti has returned the favour with rifles and support equipment for Belize’s defence."
 tad_bg.311.t:0 "Haiti Returns the Weapons"
 tad_bg.312.a:0 "A promise kept."
 tad_bg.312.d:0 "Haiti has fulfilled the reciprocal assistance agreement made during the earlier crisis."
 tad_bg.312.t:0 "The Debt to Belize Is Paid"
 tad_bg.40.a:0 "Request OAS verification."
 tad_bg.40.b:0 "Mirror their deployment."
 tad_bg.40.c:0 "Condemn Belize publicly."
 tad_bg.40.d:0 "Belize has expanded patrol activity. Local commanders warn that close contact may produce an incident."
 tad_bg.40.t:0 "Belizean Patrols Near the Adjacency Line"
 tad_bg.41.a:0 "File an OAS report."
 tad_bg.41.b:0 "Reinforce the BDF patrols."
 tad_bg.41.c:0 "Avoid a confrontation."
 tad_bg.41.d:0 "Guatemalan forces have increased activity near the Adjacency Zone. The BDF requests instructions."
 tad_bg.41.t:0 "Guatemalan Patrols Near the Adjacency Line"
 tad_bg.42.a:0 "A useful restraint."
 tad_bg.42.d:0 "Guatemala has accepted international verification rather than mirroring our deployment."
 tad_bg.42.t:0 "Guatemala Requests Verification"
 tad_bg.43.a:0 "Then readiness was necessary."
 tad_bg.43.d:0 "Guatemala has answered our patrols with additional troops."
 tad_bg.43.t:0 "Guatemala Mirrors Our Deployment"
 tad_bg.44.a:0 "The dispute enters every home."
 tad_bg.44.d:0 "Guatemala has launched a public campaign against our patrol activity."
 tad_bg.44.t:0 "Guatemala Condemns Belize"
 tad_bg.45.a:0 "The observers will be watching."
 tad_bg.45.d:0 "Belize has internationalised our patrol deployment rather than responding militarily."
 tad_bg.45.t:0 "Belize Appeals to the OAS"
 tad_bg.46.a:0 "Pressure is producing resistance."
 tad_bg.46.d:0 "The BDF has mirrored our deployment and raised its readiness."
 tad_bg.46.t:0 "Belize Reinforces the Border"
 tad_bg.47.a:0 "A temporary advantage."
 tad_bg.47.d:0 "Belize has reduced immediate contact, though the decision may weaken confidence in Belmopan."
 tad_bg.47.t:0 "Belize Avoids Confrontation"
 tad_bg.50.a:0 "Belize will not negotiate under threat."
 tad_bg.50.b:0 "Call an emergency OAS session."
 tad_bg.50.d:0 "Guatemala demands immediate negotiations under military pressure. Refusal may lead directly to war."
 tad_bg.50.t:0 "Guatemala Issues an Ultimatum"
 tad_bg.51.a:0 "Stand down for now."
 tad_bg.51.b:0 "The ultimatum stands."
 tad_bg.51.d:0 "Belize has appealed for international intervention. Guatemala must decide whether the ultimatum is worth the cost."
 tad_bg.51.t:0 "Emergency Regional Pressure"
 tad_bg.60.a:0 "Answer in the courtroom."
 tad_bg.60.d:0 "Belize has increased funding for its ICJ submissions and international legal campaign."
 tad_bg.60.t:0 "Belize Expands Its Legal Case"
 tad_bg.61.a:0 "The incident is now international."
 tad_bg.61.d:0 "Belize has asked international observers to verify recent activity."
 tad_bg.61.t:0 "Belize Invites OAS Verification"
 tad_bg.62.a:0 "Nationalism answers nationalism."
 tad_bg.62.d:0 "Belize has begun a national campaign defending its territorial integrity."
 tad_bg.62.t:0 "A Belizean Sovereignty Campaign"
 tad_bg.63.a:0 "Their fear is becoming readiness."
 tad_bg.63.d:0 "Belize has released reserve equipment and activated emergency defence measures."
 tad_bg.63.t:0 "Belize Mobilises the BDF"
 tad_bg.64.a:0 "Take note."
 tad_bg.64.d:0 "The opposing government has taken a new diplomatic or military step in the Belize–Guatemala dispute."
 tad_bg.64.t:0 "A New Step in the Differendum"
 tad_bg.65.a:0 "Take note."
 tad_bg.65.d:0 "The opposing government has taken a new diplomatic or military step in the Belize–Guatemala dispute."
 tad_bg.65.t:0 "A New Step in the Differendum"
 tad_bg.66.a:0 "Take note."
 tad_bg.66.d:0 "The opposing government has taken a new diplomatic or military step in the Belize–Guatemala dispute."
 tad_bg.66.t:0 "A New Step in the Differendum"
 tad_bg.67.a:0 "Take note."
 tad_bg.67.d:0 "The opposing government has taken a new diplomatic or military step in the Belize–Guatemala dispute."
 tad_bg.67.t:0 "A New Step in the Differendum"
 tad_bg.68.a:0 "Take note."
 tad_bg.68.d:0 "The opposing government has taken a new diplomatic or military step in the Belize–Guatemala dispute."
 tad_bg.68.t:0 "A New Step in the Differendum"
 tad_bg.69.a:0 "Take note."
 tad_bg.69.d:0 "The opposing government has taken a new diplomatic or military step in the Belize–Guatemala dispute."
 tad_bg.69.t:0 "A New Step in the Differendum"
 tad_bg.70.a:0 "We will answer with evidence."
 tad_bg.70.d:0 "Guatemala has increased funding for its ICJ submissions."
 tad_bg.70.t:0 "Guatemala Strengthens Its Legal Case"
 tad_bg.71.a:0 "Use the breathing room."
 tad_bg.71.d:0 "Guatemala has accepted OAS verification of recent patrol activity."
 tad_bg.71.t:0 "Guatemala Accepts Verification"
 tad_bg.72.a:0 "Belize will not disappear from the map."
 tad_bg.72.d:0 "A new public campaign in Guatemala has revived the territorial claim and increased domestic pressure."
 tad_bg.72.t:0 "Guatemala Reaffirms the Claim"
 tad_bg.73.a:0 "Notify every BDF command."
 tad_bg.73.d:0 "Elite Guatemalan personnel have been deployed near Belize."
 tad_bg.73.t:0 "Kaibiles Move toward the Border"
 tad_bg.74.a:0 "This is preparation, not theatre."
 tad_bg.74.d:0 "Guatemala is constructing the logistics network needed to sustain larger forces near Belize."
 tad_bg.74.t:0 "Forward Depots in Petén"
 trinidad_security_infantry:0 "Trinidad Security Infantry"
 trinidad_security_infantry_desc:0 "A compact light-infantry battalion designed for a four-width foreign or territorial formation."
