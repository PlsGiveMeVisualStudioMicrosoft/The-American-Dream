 # -----------------------------------------------------------------------------
 # Leaders and traits
 # -----------------------------------------------------------------------------
 BLZ_John_Briceno:0 "John Briceño"
 GUA_Bernardo_Arevalo:0 "Bernardo Arévalo"
 BLZ_pragmatic_modernizer:0 "Pragmatic Modernizer"
 BLZ_pragmatic_modernizer_desc:0 "A cautious reformer who combines social investment, regional diplomacy and business-friendly development."
 GUA_anti_corruption_reformer:0 "Anti-Corruption Reformer"
 GUA_anti_corruption_reformer_desc:0 "A democratic reformer determined to restore public institutions despite resistance from entrenched political networks."

 # -----------------------------------------------------------------------------
 # Political parties
 # -----------------------------------------------------------------------------
 BLZ_democratic_party:0 "PUP"
 BLZ_democratic_party_long:0 "People's United Party"
 BLZ_neutrality_party:0 "UDP"
 BLZ_neutrality_party_long:0 "United Democratic Party"
 BLZ_communism_party:0 "BPP"
 BLZ_communism_party_long:0 "Belize Progressive Party"
 BLZ_fascism_party:0 "BNM"
 BLZ_fascism_party_long:0 "Belize National Movement"

 GUA_democratic_party:0 "Semilla"
 GUA_democratic_party_long:0 "Movimiento Semilla"
 GUA_neutrality_party:0 "UNE"
 GUA_neutrality_party_long:0 "Unidad Nacional de la Esperanza"
 GUA_communism_party:0 "WINAQ-URNG"
 GUA_communism_party_long:0 "Movimiento Político Winaq - Unidad Revolucionaria Nacional Guatemalteca"
 GUA_fascism_party:0 "VALOR"
 GUA_fascism_party_long:0 "Valor"

 # -----------------------------------------------------------------------------
 # National spirits - Belize
 # -----------------------------------------------------------------------------
 BLZ_small_but_sovereign:0 "Small but Sovereign"
 BLZ_small_but_sovereign_desc:0 "Belize has limited manpower and administrative capacity, but its population strongly identifies with the country's independence and territorial integrity."
 BLZ_tourism_dependent_economy:0 "Tourism-Dependent Economy"
 BLZ_tourism_dependent_economy_desc:0 "Tourism brings foreign exchange and employment, but leaves the economy exposed to external shocks, hurricanes and global travel disruptions."
 BLZ_guatemalan_claim:0 "The Guatemalan Claim"
 BLZ_guatemalan_claim_desc:0 "Guatemala's territorial, insular and maritime claim remains a permanent security concern. The dispute is before the International Court of Justice, while the OAS monitors the Adjacency Zone."
 BLZ_compact_defence_force:0 "Compact Defence Force"
 BLZ_compact_defence_force_desc:0 "The Belize Defence Force is small, professional and experienced in jungle operations, but lacks the manpower and equipment for a prolonged conventional war."
 BLZ_commonwealth_caricom_links:0 "Commonwealth and CARICOM Links"
 BLZ_commonwealth_caricom_links_desc:0 "Belize's diplomatic position is strengthened by its membership in the Commonwealth and the Caribbean Community."
 BLZ_colonial_institutions:0 "Colonial Institutional Legacy"
 BLZ_colonial_institutions_desc:0 "British-derived institutions provide continuity, but constitutional reform and decolonisation remain unfinished political questions."
 BLZ_resilient_tourism_sector:0 "Resilient Tourism Sector"
 BLZ_resilient_tourism_sector_desc:0 "Diversified destinations, stronger infrastructure and disaster planning have reduced Belize's vulnerability to tourism shocks."
 BLZ_professional_bdf:0 "Professionalised BDF"
 BLZ_professional_bdf_desc:0 "The regular battalions, Volunteer Battalion and specialist elements have been integrated into a more coherent national defence system."
 BLZ_total_defence:0 "Total Defence Plan"
 BLZ_total_defence_desc:0 "The government is preparing the entire country for territorial defence, combining regular soldiers, volunteers, civil authorities and international support."
 BLZ_cross_border_cooperation:0 "Cross-Border Cooperation"
 BLZ_cross_border_cooperation_desc:0 "Community projects and OAS verification mechanisms are reducing the risk that a local incident escalates into a national crisis."
 BLZ_constitutional_reform_process:0 "Constitutional Reform Process"
 BLZ_constitutional_reform_process_desc:0 "A national commission is reviewing the monarchy, public institutions and the balance between central and local government."

 # -----------------------------------------------------------------------------
 # National spirits - Guatemala
 # -----------------------------------------------------------------------------
 GUA_pact_of_corrupt:0 "Entrenched Corruption Networks"
 GUA_pact_of_corrupt_desc:0 "Political, judicial and economic networks commonly described as the 'pact of the corrupt' resist institutional reform and threaten the government's mandate."
 GUA_fragmented_congress:0 "Fragmented Congress"
 GUA_fragmented_congress_desc:0 "The governing reform movement lacks a stable congressional majority and must negotiate every major initiative."
 GUA_remittance_economy:0 "Remittance-Driven Consumption"
 GUA_remittance_economy_desc:0 "Remittances support millions of households and domestic consumption, but they also reveal the economy's dependence on migration and limited formal employment."
 GUA_legacy_internal_conflict:0 "Legacy of the Internal Conflict"
 GUA_legacy_internal_conflict_desc:0 "The civil war left deep mistrust between the state, the armed forces and Indigenous communities. Its institutional and social consequences remain unresolved."
 GUA_historic_claim_to_belize:0 "Historic Claim to Belize"
 GUA_historic_claim_to_belize_desc:0 "Successive Guatemalan governments have maintained a territorial, insular and maritime claim against Belize. The dispute is now before the International Court of Justice."
 GUA_underfunded_security_forces:0 "Underfunded Security Forces"
 GUA_underfunded_security_forces_desc:0 "The armed forces possess experienced formations and special operations units, but maintenance, mobility and modern equipment remain uneven."
 GUA_reform_coalition:0 "Reform Coalition"
 GUA_reform_coalition_desc:0 "A negotiated coalition of reformists, Indigenous representatives and pragmatic legislators provides the government with a working majority."
 GUA_clean_government:0 "Clean Government Programme"
 GUA_clean_government_desc:0 "Procurement transparency, civil-service reform and stronger oversight are gradually weakening entrenched corruption networks."
 GUA_rural_inclusion:0 "Rural and Indigenous Inclusion"
 GUA_rural_inclusion_desc:0 "Public investment and structured dialogue are beginning to connect rural and Indigenous communities with the state."
 GUA_professional_armed_forces:0 "Professional Armed Forces"
 GUA_professional_armed_forces_desc:0 "The high command has improved readiness, logistics and civilian accountability while preserving specialist jungle and mountain capabilities."
 GUA_kaibil_border_deployment:0 "Kaibil Border Deployment"
 GUA_kaibil_border_deployment_desc:0 "Elite troops have been deployed to reinforce border operations. Their effectiveness is considerable, but the move carries political and human-rights costs."
 GUA_new_democratic_compact:0 "New Democratic Compact"
 GUA_new_democratic_compact_desc:0 "A broad agreement supports democratic institutions, Indigenous participation and a gradual restoration of the rule of law."
 GUA_joint_development_zone:0 "Joint Development Zone"
 GUA_joint_development_zone_desc:0 "Belize and Guatemala are cooperating on infrastructure, conservation and local commerce without prejudicing their legal positions."

 # -----------------------------------------------------------------------------
 # Belize focus tree
 # -----------------------------------------------------------------------------
 BLZ_the_jewel_in_2025:0 "The Jewel in 2025"
 BLZ_the_jewel_in_2025_desc:0 "Belize enters 2025 as a small Caribbean democracy facing economic vulnerability, climate risks and an unresolved territorial dispute with Guatemala."
 BLZ_second_term_mandate:0 "Consolidate the PUP Mandate"
 BLZ_second_term_mandate_desc:0 "The government must turn its electoral strength into durable institutional and economic reforms."
 BLZ_constitutional_reform_commission:0 "Constitutional Reform Commission"
 BLZ_constitutional_reform_commission_desc:0 "Open a structured national debate on the monarchy, rights, public accountability and the future shape of the Belizean state."
 BLZ_strengthen_local_government:0 "Strengthen Local Government"
 BLZ_strengthen_local_government_desc:0 "Municipalities and district administrations need greater capacity to deliver services beyond Belize City and Belmopan."
 BLZ_decolonise_public_institutions:0 "Decolonise Public Institutions"
 BLZ_decolonise_public_institutions_desc:0 "Modernise inherited institutions while preserving the legal stability that has served Belize since independence."
 BLZ_plan_belize_growth:0 "Plan Belize Growth Programme"
 BLZ_plan_belize_growth_desc:0 "Direct public investment toward infrastructure, local enterprise and more resilient economic growth."
 BLZ_tourism_resilience:0 "Build Tourism Resilience"
 BLZ_tourism_resilience_desc:0 "Diversify tourism, strengthen disaster planning and reduce dependence on a narrow set of coastal destinations."
 BLZ_blue_economy_agenda:0 "Blue Economy Agenda"
 BLZ_blue_economy_agenda_desc:0 "Develop ports, fisheries and marine services without sacrificing the barrier reef that underpins Belize's long-term prosperity."
 BLZ_agricultural_modernisation:0 "Modernise Agriculture"
 BLZ_agricultural_modernisation_desc:0 "Improve processing, transport and productivity in the sugar, citrus, livestock and food sectors."
 BLZ_digital_belize:0 "Digital Belize"
 BLZ_digital_belize_desc:0 "Expand digital government, connectivity and technical education to overcome the limitations of a small domestic market."
 BLZ_review_bdf_readiness:0 "Review BDF Readiness"
 BLZ_review_bdf_readiness_desc:0 "Assess the readiness of the regular battalions, Volunteer Battalion and specialist elements against realistic national-security missions."
 BLZ_first_battalion_readiness:0 "Reinforce the 1st Battalion"
 BLZ_first_battalion_readiness_desc:0 "Improve the southern battalion's mobility, small-arms stocks and ability to sustain jungle patrols."
 BLZ_second_battalion_readiness:0 "Reinforce the 2nd Battalion"
 BLZ_second_battalion_readiness_desc:0 "Raise readiness around the national command structure and central districts."
 BLZ_volunteer_guard:0 "Expand the Volunteer Battalion"
 BLZ_volunteer_guard_desc:0 "A stronger volunteer component can provide local knowledge, reserve manpower and disaster-response capacity."
 BLZ_jungle_warfare_school:0 "Jungle Warfare School"
 BLZ_jungle_warfare_school_desc:0 "Turn Belize's terrain and long-standing British training links into a genuine national military advantage."
 BLZ_coast_guard_coordination:0 "Coordinate with the Coast Guard"
 BLZ_coast_guard_coordination_desc:0 "Link riverine, coastal and land surveillance into a single national operating picture."
 BLZ_batsub_partnership:0 "Deepen the BATSUB Partnership"
 BLZ_batsub_partnership_desc:0 "British jungle-training facilities and advisers can support doctrine, logistics and professional development."
 BLZ_icj_legal_team:0 "Fund the ICJ Legal Team"
 BLZ_icj_legal_team_desc:0 "A well-resourced legal case is Belize's strongest peaceful instrument for defending its territorial integrity."
 BLZ_oas_adjacency_office:0 "Back the OAS Adjacency Office"
 BLZ_oas_adjacency_office_desc:0 "Verification, dialogue and community contact reduce the risk of fatal misunderstandings in the Adjacency Zone."
 BLZ_document_every_incident:0 "Document Every Incident"
 BLZ_document_every_incident_desc:0 "Border patrol reports, GPS evidence and civilian testimony must be systematically preserved for diplomatic and legal use."
 BLZ_seek_final_settlement:0 "Seek a Final Settlement"
 BLZ_seek_final_settlement_desc:0 "Offer Guatemala a path toward normal relations based on binding law, confidence-building measures and mutual economic benefit."
 BLZ_hold_the_line:0 "Hold the Line"
 BLZ_hold_the_line_desc:0 "Belize will continue diplomacy, but it will not permit pressure in the Adjacency Zone to alter facts on the ground."
 BLZ_total_defence_plan:0 "Total Defence Plan"
 BLZ_total_defence_plan_desc:0 "Prepare regular forces, volunteers, civil authorities and strategic infrastructure for a national emergency."
 BLZ_caricom_anchor:0 "Anchor Ourselves in CARICOM"
 BLZ_caricom_anchor_desc:0 "Caribbean diplomatic solidarity is essential to Belize's security and economic identity."
 BLZ_taiwan_partnership:0 "Taiwan Development Partnership"
 BLZ_taiwan_partnership_desc:0 "Use technical and development cooperation to strengthen public administration and local industry."
 BLZ_us_security_assistance:0 "US Security Assistance"
 BLZ_us_security_assistance_desc:0 "Seek communications equipment, training and logistical support for border security and counter-trafficking operations."
 BLZ_secure_sovereignty:0 "Secure Belizean Sovereignty"
 BLZ_secure_sovereignty_desc:0 "Whether through binding settlement or credible deterrence, Belize must enter the future with confidence in its independence."

 # -----------------------------------------------------------------------------
 # Guatemala focus tree
 # -----------------------------------------------------------------------------
 GUA_new_spring:0 "A New Guatemalan Spring"
 GUA_new_spring_desc:0 "The Arévalo administration begins 2025 promising democratic renewal while facing entrenched opposition, inequality and insecurity."
 GUA_defend_electoral_mandate:0 "Defend the Electoral Mandate"
 GUA_defend_electoral_mandate_desc:0 "Protect the constitutional transfer of power and the authority granted by the 2023 election."
 GUA_build_congressional_coalition:0 "Build a Congressional Coalition"
 GUA_build_congressional_coalition_desc:0 "Reform requires votes. Construct a pragmatic legislative alliance without abandoning the government's core mandate."
 GUA_civil_service_merit:0 "Merit-Based Civil Service"
 GUA_civil_service_merit_desc:0 "Professional recruitment and transparent procurement can make the state less vulnerable to patronage networks."
 GUA_confront_pact_of_corrupt:0 "Confront the Pact of the Corrupt"
 GUA_confront_pact_of_corrupt_desc:0 "Entrenched networks will not surrender their influence voluntarily. The government must challenge them directly."
 GUA_independent_justice:0 "Defend Judicial Independence"
 GUA_independent_justice_desc:0 "Restore confidence in legal institutions and resist the political use of prosecutors and courts."
 GUA_indigenous_dialogue:0 "Dialogue with Indigenous Authorities"
 GUA_indigenous_dialogue_desc:0 "Indigenous communities played a decisive role in defending democracy and must have a genuine place in national policy."
 GUA_new_democratic_compact_focus:0 "A New Democratic Compact"
 GUA_new_democratic_compact_focus_desc:0 "Bind reformists, communities and responsible institutions into a durable democratic settlement."
 GUA_rural_roads_program:0 "Rural Roads Programme"
 GUA_rural_roads_program_desc:0 "Poor transport connections isolate communities, raise food prices and limit access to schools and clinics."
 GUA_highlands_investment:0 "Invest in the Highlands"
 GUA_highlands_investment_desc:0 "Target public investment toward Indigenous and rural regions that have historically received little state support."
 GUA_remittance_to_investment:0 "Turn Remittances into Investment"
 GUA_remittance_to_investment_desc:0 "Create financial channels that convert household remittances into formal enterprise and productive investment."
 GUA_pacific_logistics:0 "Modernise Pacific Logistics"
 GUA_pacific_logistics_desc:0 "Ports and transport corridors can connect Guatemalan producers more efficiently to international markets."
 GUA_northern_development:0 "Develop the Northern Departments"
 GUA_northern_development_desc:0 "Infrastructure, conservation and legitimate employment are essential to reducing trafficking and state absence in the north."
 GUA_reorganize_high_command:0 "Reorganise the High Command"
 GUA_reorganize_high_command_desc:0 "Clarify missions, improve readiness reporting and align the armed forces with constitutional civilian authority."
 GUA_modernize_infantry_brigades:0 "Modernise the Infantry Brigades"
 GUA_modernize_infantry_brigades_desc:0 "Replace worn equipment, improve communications and standardise logistics across the regular brigades."
 GUA_kaibil_readiness:0 "Maintain Kaibil Readiness"
 GUA_kaibil_readiness_desc:0 "Guatemala's elite jungle and special-operations capability remains valuable, but it must operate under clear legal control."
 GUA_air_mobility:0 "Restore Air Mobility"
 GUA_air_mobility_desc:0 "Vehicles and light aviation are vital in a country of mountains, jungle and widely separated borders."
 GUA_border_task_forces:0 "Integrated Border Task Forces"
 GUA_border_task_forces_desc:0 "Coordinate regular units, specialists and civil agencies against trafficking and armed groups."
 GUA_civilian_control_military:0 "Civilian Control of the Military"
 GUA_civilian_control_military_desc:0 "A professional force must be effective in the field and firmly subordinate to democratic institutions."
 GUA_reaffirm_historic_claim:0 "Reaffirm the Historic Claim"
 GUA_reaffirm_historic_claim_desc:0 "Restate Guatemala's legal position while the case remains before the International Court of Justice."
 GUA_icj_memorial:0 "Strengthen the ICJ Case"
 GUA_icj_memorial_desc:0 "Invest in archives, cartography and international legal expertise rather than relying on nationalist rhetoric alone."
 GUA_adjacent_zone_patrols:0 "Expand Adjacency Zone Patrols"
 GUA_adjacent_zone_patrols_desc:0 "Increase state presence in Petén and along the Adjacency Line, accepting the risk of closer contact with Belizean patrols."
 GUA_propose_joint_development:0 "Propose Joint Development"
 GUA_propose_joint_development_desc:0 "Cooperate on conservation, infrastructure and local commerce without requiring either side to abandon its formal legal position."
 GUA_accept_binding_judgment:0 "Accept a Binding Judgment"
 GUA_accept_binding_judgment_desc:0 "Commit the state to a peaceful, final resolution and redirect national resources toward development."
 GUA_pressure_belmopan:0 "Pressure Belmopan"
 GUA_pressure_belmopan_desc:0 "Use patrols, diplomacy and public mobilisation to force Belize to treat the claim as a political rather than purely legal question."
 GUA_enforce_historic_claim:0 "Prepare to Enforce the Claim"
 GUA_enforce_historic_claim_desc:0 "If diplomacy and law fail, prepare an ultimatum backed by military force. This path could ignite a regional war."
 GUA_central_american_leadership:0 "Central American Leadership"
 GUA_central_american_leadership_desc:0 "Guatemala should use its demographic and economic weight to shape regional cooperation."
 GUA_us_security_partnership:0 "US Security Partnership"
 GUA_us_security_partnership_desc:0 "Seek equipment and training for mobility, border surveillance and counter-trafficking operations."
 GUA_taiwan_cooperation:0 "Cooperation with Taiwan"
 GUA_taiwan_cooperation_desc:0 "Expand technical, agricultural and infrastructure cooperation with Guatemala's long-standing diplomatic partner."
 GUA_guatemala_avanza:0 "Guatemala Avanza"
 GUA_guatemala_avanza_desc:0 "Combine democratic reform, development and a professional security state into a coherent national project."

 # -----------------------------------------------------------------------------
 # Dispute decisions
 # -----------------------------------------------------------------------------
 TAD_BG_dispute_category:0 "The Belize-Guatemala Differendum"
 TAD_BG_dispute_category_desc:0 "The territorial dispute remains before the ICJ, while the OAS monitors the Adjacency Zone. Current tension: §Y[?BLZ.BLZ_GUA_tension|0]§!/100. Diplomatic measures lower tension; patrols, nationalist campaigns and ultimatums raise it."
 BLZ_fund_icj_case:0 "Fund Additional ICJ Research"
 BLZ_fund_icj_case_desc:0 "Expand archival, cartographic and legal work supporting Belize's case."
 BLZ_invite_oas_verification:0 "Invite OAS Verification"
 BLZ_invite_oas_verification_desc:0 "Request independent verification of recent activity in the Adjacency Zone."
 BLZ_expand_adjacency_patrols:0 "Expand Belizean Patrols"
 BLZ_expand_adjacency_patrols_desc:0 "Increase BDF activity near the Adjacency Line. This improves readiness but raises the chance of confrontation."
 BLZ_sovereignty_campaign:0 "National Sovereignty Campaign"
 BLZ_sovereignty_campaign_desc:0 "Mobilise public support around Belize's territorial integrity."
 BLZ_cross_border_projects:0 "Fund Cross-Border Community Projects"
 BLZ_cross_border_projects_desc:0 "Support practical cooperation among communities living near the Adjacency Zone."
 BLZ_emergency_mobilization:0 "Emergency BDF Mobilisation"
 BLZ_emergency_mobilization_desc:0 "Call up volunteers, release reserve equipment and activate the Total Defence Plan."
 GUA_fund_icj_memorial_decision:0 "Fund Additional ICJ Research"
 GUA_fund_icj_memorial_decision_desc:0 "Strengthen Guatemala's legal and historical submissions to the Court."
 GUA_accept_oas_verification:0 "Accept OAS Verification"
 GUA_accept_oas_verification_desc:0 "Permit international observers to verify patrol activity and alleged incidents."
 GUA_expand_peten_patrols:0 "Expand Petén Patrols"
 GUA_expand_peten_patrols_desc:0 "Increase military presence near the Adjacency Line."
 GUA_public_claim_campaign:0 "Public Campaign for the Claim"
 GUA_public_claim_campaign_desc:0 "Use speeches, education and national media to increase support for Guatemala's territorial position."
 GUA_deploy_kaibiles_to_border:0 "Deploy Kaibiles to the Border"
 GUA_deploy_kaibiles_to_border_desc:0 "Use elite troops for patrol and deterrence missions near Belize."
 GUA_joint_development_offer_decision:0 "Renew the Joint Development Offer"
 GUA_joint_development_offer_decision_desc:0 "Invite Belize to cooperate on development and conservation without prejudicing the legal case."
 GUA_issue_belize_ultimatum:0 "Issue an Ultimatum to Belize"
 GUA_issue_belize_ultimatum_desc:0 "Demand immediate negotiations under military pressure. Refusal may produce a war goal."

 # -----------------------------------------------------------------------------
 # Events
 # -----------------------------------------------------------------------------
 tad_bg.1.t:0 "Belize at a Crossroads"
 tad_bg.1.d:0 "Our country enters 2025 with democratic stability and strong regional friendships, but the economy remains vulnerable and the Guatemalan claim is unresolved. We must choose between passive management and a serious national programme."
 tad_bg.1.a:0 "The Jewel must endure."
 tad_bg.2.t:0 "A Government Under Pressure"
 tad_bg.2.d:0 "President Arévalo's reform mandate is real, but so is the resistance of entrenched institutions. At the same time, poverty, trafficking and the Belize claim compete for the government's limited attention."
 tad_bg.2.a:0 "The spring must become a state."
 tad_bg.10.t:0 "Belize Proposes a Final Settlement"
 tad_bg.10.d:0 "Belmopan proposes that both governments commit themselves fully to a peaceful and binding settlement, accompanied by confidence-building measures and normalised bilateral relations."
 tad_bg.10.a:0 "Accept a final peaceful settlement."
 tad_bg.10.b:0 "Offer joint development without abandoning our case."
 tad_bg.10.c:0 "Reject the proposal."
 tad_bg.11.t:0 "Guatemala Rejects the Settlement Proposal"
 tad_bg.11.d:0 "Guatemala has refused our proposal for a final settlement. The government must reassure the public that Belize's sovereignty will not be negotiated under pressure."
 tad_bg.11.a:0 "Then we prepare for a longer struggle."
 tad_bg.20.t:0 "Guatemala Reaffirms Its Claim"
 tad_bg.20.d:0 "The Guatemalan government has publicly reaffirmed its territorial, insular and maritime claim. Although the dispute remains before the ICJ, the statement has caused anger and concern throughout Belize."
 tad_bg.20.a:0 "File a formal diplomatic protest."
 tad_bg.20.b:0 "Answer with a sovereignty campaign."
 tad_bg.30.t:0 "Guatemala Offers Joint Development"
 tad_bg.30.d:0 "Guatemala proposes cooperation on conservation, infrastructure and local commerce near the Adjacency Zone while both sides retain their legal positions."
 tad_bg.30.a:0 "Practical cooperation is worth attempting."
 tad_bg.30.b:0 "The proposal creates too much ambiguity."
 tad_bg.31.t:0 "Belize Rejects Joint Development"
 tad_bg.31.d:0 "Belize has rejected our proposal, arguing that joint arrangements could blur sovereignty and complicate the legal case."
 tad_bg.31.a:0 "Then the pressure will continue."
 tad_bg.40.t:0 "Belizean Patrols Near the Adjacency Line"
 tad_bg.40.d:0 "Belizean troops have increased patrols near the Adjacency Line. No shots have been fired, but local commanders warn that close contact could lead to an incident."
 tad_bg.40.a:0 "Request OAS verification."
 tad_bg.40.b:0 "Mirror their deployment."
 tad_bg.41.t:0 "Guatemalan Patrols Near the Adjacency Line"
 tad_bg.41.d:0 "Guatemalan troops have increased their presence near the Adjacency Line. The BDF reports no direct violation, but the atmosphere is becoming more dangerous."
 tad_bg.41.a:0 "File an OAS report."
 tad_bg.41.b:0 "Reinforce our patrols."
 tad_bg.50.t:0 "Guatemala Issues an Ultimatum"
 tad_bg.50.d:0 "Guatemala demands immediate negotiations under the shadow of military force. Accepting emergency talks may reduce the immediate danger, but refusing could lead directly to war."
 tad_bg.50.a:0 "Belize will not negotiate under threat."
 tad_bg.50.b:0 "Call an emergency OAS session."
 tad_bg.51.t:0 "The OAS Calls for Restraint"
 tad_bg.51.d:0 "Belize has appealed to the OAS, and regional governments are urging both sides to stand down. We can pause the confrontation or proceed despite diplomatic pressure."
 tad_bg.51.a:0 "Stand down for now."
 tad_bg.51.b:0 "The ultimatum stands."
