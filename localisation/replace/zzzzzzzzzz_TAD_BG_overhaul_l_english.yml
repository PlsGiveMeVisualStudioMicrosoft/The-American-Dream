 GUA_border_command_tier_2:0 "Northern Offensive Command"

 BLZ_wartime_mobilisation:0 "Wartime Mobilisation"
 BLZ_wartime_mobilisation_desc:0 "Belize's compact defence establishment has shifted to emergency recruitment, rapid reinforcement and defence of the country's principal population centres."
 GUA_operation_belize_offensive:0 "Operation National Integrity"
 GUA_operation_belize_offensive_desc:0 "The northern command has been granted priority access to planning staff, transport and supplies for an offensive into Belize."

 BLZ_recruit_caribbean_manpower_pool:0 "Recruit Caribbean Volunteer Personnel"
 BLZ_recruit_caribbean_manpower_pool_desc:0 "Fund a limited recruitment drive among sympathetic Caribbean veterans and security personnel. They strengthen our available manpower pool, but the contracts place a temporary burden on the civilian economy."
 BLZ_expand_diaspora_manpower_pool:0 "Expand Diaspora Recruitment"
 BLZ_expand_diaspora_manpower_pool_desc:0 "Offer travel, housing and service contracts to Belizeans abroad willing to return for emergency duty."
 GUA_contract_foreign_security_brigade:0 "Contract a Foreign Security Brigade"
 GUA_contract_foreign_security_brigade_desc:0 "Hire foreign military personnel for a single under-equipped brigade. Guatemala does not supply the manpower, but the contract diverts civilian production for a full year."
 BLZ_caribbean_manpower_contract:0 "Caribbean Personnel Contracts"
 BLZ_caribbean_manpower_contract_desc:0 "Foreign recruitment, transport and accommodation contracts are consuming part of our civilian economy."
 BLZ_diaspora_manpower_contract:0 "Diaspora Recruitment Costs"
 BLZ_diaspora_manpower_contract_desc:0 "The return and integration of diaspora volunteers requires temporary civilian expenditure."
 GUA_foreign_security_contract:0 "Foreign Military Contract"
 GUA_foreign_security_contract_desc:0 "A foreign security brigade is being maintained through expensive industrial and service contracts."
 hai_fuel.50.e:0 "There are no remaining targets."
