l_english:
 TAD_BG_force_generation_category:0 "Emergency Force Generation"
 TAD_BG_force_generation_category_desc:0 "Raise real formations using political authority. The full manpower requirement is deducted immediately, while new units begin at only §R1% equipment§! and must draw weapons from the national stockpile."
 BLZ_raise_territorial_group:0 "Raise a Territorial Defence Group"
 BLZ_raise_territorial_group_desc:0 "Authorize another local defence formation. §Y1,000 manpower§! is deducted immediately; the unit appears at only §R1% equipment§! and must draw rifles from Belize's stockpile."
 BLZ_raise_regular_battalion:0 "Raise an Emergency BDF Battalion"
 BLZ_raise_regular_battalion_desc:0 "Expand the professional force around a new BDF battalion. §Y2,300 manpower§! is deducted immediately, while equipment must be supplied from Belize's stockpile."
 GUA_raise_infantry_brigade:0 "Raise a Northern Infantry Brigade"
 GUA_raise_infantry_brigade_desc:0 "Authorize a new brigade for the northern command. §Y4,500 manpower§! is deducted immediately; the brigade begins at only §R1% equipment§!."
 GUA_raise_mountain_brigade:0 "Raise a Petén Mountain Brigade"
 GUA_raise_mountain_brigade_desc:0 "Create a light mountain formation for operations in Petén and Belize. §Y2,500 manpower§! is deducted immediately; the brigade begins at only §R1% equipment§!."

