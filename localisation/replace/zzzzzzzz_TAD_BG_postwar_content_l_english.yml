l_english:
 # Belize postwar branch
 BLZ_postwar_national_review:0 "The Day After the Differendum"
 BLZ_postwar_national_review_desc:0 "Whether the crisis ended in a settlement or armed survival, Belize must now turn emergency institutions into a durable national strategy."
 BLZ_honour_the_defenders:0 "Honour the Defenders"
 BLZ_honour_the_defenders_desc:0 "The BDF, police, volunteers and civilians who kept the country functioning deserve public recognition."
 BLZ_veterans_reintegration_program:0 "Veterans Reintegration Programme"
 BLZ_veterans_reintegration_program_desc:0 "Service must not become a lifetime sentence to unemployment or neglect."
 BLZ_permanent_intelligence_service:0 "A Permanent Intelligence Service"
 BLZ_permanent_intelligence_service_desc:0 "The improvised networks created during the crisis will become a small professional intelligence service."
 BLZ_bdf_engineering_corps:0 "The BDF Engineering Corps"
 BLZ_bdf_engineering_corps_desc:0 "Military engineers can rebuild roads, harden depots and maintain the infrastructure needed for national resilience."
 BLZ_caribbean_defence_college:0 "Caribbean Defence College"
 BLZ_caribbean_defence_college_desc:0 "Belize will exchange lessons with regional officers rather than relearn them alone in the next emergency."
 BLZ_never_again_unprepared:0 "Never Again Unprepared"
 BLZ_never_again_unprepared_desc:0 "Preparedness must become a permanent habit, not a temporary response to headlines."
 BLZ_rebuild_the_western_corridor:0 "Rebuild the Western Corridor"
 BLZ_rebuild_the_western_corridor_desc:0 "The road between Belize City, Belmopan and the western districts is the country's strategic spine."
 BLZ_belize_city_reconstruction_authority:0 "Belize City Reconstruction Authority"
 BLZ_belize_city_reconstruction_authority_desc:0 "A dedicated authority will modernise utilities, housing and commercial infrastructure in the old capital."
 BLZ_expand_port_belize:0 "Expand Port Belize"
 BLZ_expand_port_belize_desc:0 "A deeper and better protected harbour will connect Belize to Caribbean trade and emergency supply routes."
 BLZ_caribbean_shipping_registry:0 "A Caribbean Shipping Registry"
 BLZ_caribbean_shipping_registry_desc:0 "A modern maritime registry can turn location and legal stability into long-term revenue."
 BLZ_resilient_tourism_compact:0 "Resilient Tourism Compact"
 BLZ_resilient_tourism_compact_desc:0 "Tourism must survive hurricanes, regional crises and temporary border closures."
 BLZ_return_diaspora_professionals:0 "Bring Home Diaspora Professionals"
 BLZ_return_diaspora_professionals_desc:0 "Engineers, doctors and entrepreneurs abroad can help build the Belize that convinced them to return."
 BLZ_national_development_bank:0 "The Belize National Development Bank"
 BLZ_national_development_bank_desc:0 "A public development bank will direct scarce capital toward infrastructure and productive investment."
 BLZ_permanent_border_commission:0 "A Permanent Border Commission"
 BLZ_permanent_border_commission_desc:0 "Regular technical contact is less dramatic than a crisis, and that is precisely its value."
 BLZ_cross_border_trade_zone:0 "Propose a Cross-Border Trade Zone"
 BLZ_cross_border_trade_zone_desc:0 "Legal trade and shared livelihoods can make renewed escalation more expensive for both governments."
 BLZ_caricom_security_guarantee:0 "Deepen the CARICOM Security Guarantee"
 BLZ_caricom_security_guarantee_desc:0 "Regional solidarity should be translated into consultation procedures, logistics plans and political commitments."
 BLZ_international_investment_conference:0 "Belmopan Investment Conference"
 BLZ_international_investment_conference_desc:0 "The end of the crisis creates an opportunity to present Belize as stable, connected and open for investment."
 BLZ_constitutional_security_oversight:0 "Constitutional Security Oversight"
 BLZ_constitutional_security_oversight_desc:0 "Emergency powers must not quietly become permanent powers without democratic supervision."
 BLZ_secure_generation_2035:0 "The Secure Generation of 2035"
 BLZ_secure_generation_2035_desc:0 "A safer border, stronger institutions and a diversified economy will define the next Belizean generation."

 # Guatemala postwar branch
 GUA_postwar_strategic_review:0 "The Postwar Strategic Review"
 GUA_postwar_strategic_review_desc:0 "Guatemala must examine the military, political and economic costs of the Belize crisis before writing the next chapter."
 GUA_lessons_of_peten:0 "Lessons of Petén"
 GUA_lessons_of_peten_desc:0 "The northern theatre exposed the limits of roads, supply depots and assumptions made in Guatemala City."
 GUA_demobilise_border_forces:0 "Demobilise the Border Forces"
 GUA_demobilise_border_forces_desc:0 "Units held at emergency readiness should return to ordinary duties before mobilisation becomes normal politics."
 GUA_veterans_and_families_program:0 "Veterans and Families Programme"
 GUA_veterans_and_families_program_desc:0 "The state must recognise the soldiers and families who carried the burden of the crisis."
 GUA_civil_military_compact:0 "A New Civil-Military Compact"
 GUA_civil_military_compact_desc:0 "Operational professionalism and civilian authority are not enemies; each is necessary for the other."
 GUA_professional_logistics_command:0 "Professional Logistics Command"
 GUA_professional_logistics_command_desc:0 "Transport, maintenance and supply planning require permanent institutions rather than emergency improvisation."
 GUA_secure_the_northern_frontier:0 "Secure the Northern Frontier"
 GUA_secure_the_northern_frontier_desc:0 "Security in Petén must rest on infrastructure and professional presence, not periodic shows of force."
 GUA_peten_reconstruction_authority:0 "Petén Reconstruction Authority"
 GUA_peten_reconstruction_authority_desc:0 "The north needs roads, services and civilian investment after years of strategic neglect."
 GUA_national_logistics_grid:0 "A National Logistics Grid"
 GUA_national_logistics_grid_desc:0 "Connecting the highlands, eastern departments, ports and Petén will strengthen both commerce and resilience."
 GUA_expand_puerto_barrios:0 "Expand Puerto Barrios"
 GUA_expand_puerto_barrios_desc:0 "The Caribbean gateway must be capable of handling a larger share of national trade."
 GUA_pacific_freight_corridor:0 "Pacific Freight Corridors"
 GUA_pacific_freight_corridor_desc:0 "Modern roads and industry along the Pacific can reduce the country's dependence on a single route."
 GUA_rural_electrification_program:0 "Rural Electrification Programme"
 GUA_rural_electrification_program_desc:0 "Development is not national while entire communities remain beyond reliable power and industry."
 GUA_indigenous_municipal_compact:0 "Indigenous Municipal Compact"
 GUA_indigenous_municipal_compact_desc:0 "Local institutions and indigenous communities must have a meaningful role in development decisions."
 GUA_anti_corruption_chambers:0 "Independent Anti-Corruption Chambers"
 GUA_anti_corruption_chambers_desc:0 "Reconstruction money must not become another prize for entrenched networks."
 GUA_normalise_relations_with_belize:0 "Normalise Relations with Belize"
 GUA_normalise_relations_with_belize_desc:0 "Permanent hostility is not a strategy. Guatemala will reopen structured political contact with Belmopan."
 GUA_joint_border_commission:0 "Create a Joint Border Commission"
 GUA_joint_border_commission_desc:0 "Surveyors, customs officials and local representatives can prevent small disputes from becoming national crises."
 GUA_central_american_customs_union:0 "Central American Customs Union"
 GUA_central_american_customs_union_desc:0 "Regional trade integration offers influence through prosperity rather than coercion."
 GUA_regional_disaster_response_force:0 "Regional Disaster Response Force"
 GUA_regional_disaster_response_force_desc:0 "The same logistics used for mobilisation can save lives after hurricanes, earthquakes and floods."
 GUA_mesoamerican_infrastructure_fund:0 "Mesoamerican Infrastructure Fund"
 GUA_mesoamerican_infrastructure_fund_desc:0 "A regional fund will finance ports, roads and cross-border links that no single department can build alone."
 GUA_guatemala_2035:0 "Guatemala 2035"
 GUA_guatemala_2035_desc:0 "A more connected, accountable and confident republic will emerge from the failures revealed by the crisis."

 # Postwar decisions
 TAD_BG_postwar_recovery_category:0 "Postwar Recovery and Reconciliation"
 TAD_BG_postwar_recovery_category_desc:0 "The crisis has ended, but roads, veterans, ports and bilateral relations still require sustained political attention."
 BLZ_postwar_veterans_housing:0 "Veterans Housing Grants"
 BLZ_postwar_veterans_housing_desc:0 "Support veterans and their families as they return to civilian life."
 BLZ_postwar_repair_western_road:0 "Repair the Western Road"
 BLZ_postwar_repair_western_road_desc:0 "Continue the long reconstruction of Belize's strategic road network."
 BLZ_postwar_port_shipping_contracts:0 "Port Belize Shipping Contracts"
 BLZ_postwar_port_shipping_contracts_desc:0 "Use public contracts to expand harbour capacity and the merchant fleet."
 GUA_postwar_veterans_grants:0 "Veterans Reintegration Grants"
 GUA_postwar_veterans_grants_desc:0 "Fund the transition from emergency mobilisation back to civilian employment."
 GUA_postwar_peten_reconstruction:0 "Petén Reconstruction Drive"
 GUA_postwar_peten_reconstruction_desc:0 "Extend roads and services into the northern departments."
 GUA_postwar_border_trade_permits:0 "Issue Border Trade Permits"
 GUA_postwar_border_trade_permits_desc:0 "Expand legal commerce under the new bilateral arrangements."

 # Postwar events
 tad_bg_postwar.1.t:0 "The Day After the Differendum"
 tad_bg_postwar.1.d:0 "The immediate danger has passed, but Belize cannot simply return to the habits that left it exposed. Cabinet now faces a harder task: preserving national unity while converting emergency measures into useful institutions, rebuilding the western corridor and ensuring that security never overwhelms democracy."
 tad_bg_postwar.1.a:0 "The reconstruction begins now."
 tad_bg_postwar.2.t:0 "Guatemala Counts the Cost"
 tad_bg_postwar.2.d:0 "The Belize crisis has ended without resolving every argument inside Guatemala. Officers cite logistical failures, reformers cite political recklessness, and communities in Petén ask what the mobilisation delivered for them. A strategic review will determine whether the country learns from the crisis or merely waits for another."
 tad_bg_postwar.2.a:0 "Open every file."
 tad_bg_postwar.3.t:0 "Belize Proposes a Cross-Border Trade Zone"
 tad_bg_postwar.3.d:0 "Belmopan proposes a regulated trade zone along the border, supported by customs liaison offices and local commercial permits. Supporters argue that shared economic interests will reduce the appeal of escalation. Opponents warn that accepting the proposal could look like a retreat from Guatemala's historic position."
 tad_bg_postwar.3.a:0 "Accept the trade zone."
 tad_bg_postwar.3.b:0 "The political cost is too high."
 tad_bg_postwar.4.t:0 "Guatemala Accepts the Trade Zone"
 tad_bg_postwar.4.d:0 "Guatemala has accepted the framework for a regulated cross-border trade zone. The agreement does not erase the past, but customs officials and local businesses will now have a practical reason to keep the frontier calm."
 tad_bg_postwar.4.a:0 "Turn agreement into daily routine."
 tad_bg_postwar.5.t:0 "Guatemala Rejects the Trade Zone"
 tad_bg_postwar.5.d:0 "Guatemala has rejected the proposed trade zone, citing domestic political concerns. The refusal is disappointing, but Belize's reconstruction programme will continue without waiting for approval from across the border."
 tad_bg_postwar.5.a:0 "We proceed on our own terms."
 tad_bg_postwar.6.t:0 "A Secure Generation"
 tad_bg_postwar.6.d:0 "Belize has transformed a moment of vulnerability into a decade-long programme of institutional reform, defence preparation and economic reconstruction. The country remains small, but it no longer confuses smallness with helplessness."
 tad_bg_postwar.6.a:0 "Belize enters the next decade with confidence."
 tad_bg_postwar.7.t:0 "Guatemala 2035"
 tad_bg_postwar.7.d:0 "The republic has connected neglected regions, professionalised logistics and reopened regional diplomacy after the Belize crisis. Guatemala's strength now rests less on declarations and more on institutions capable of carrying policy beyond the capital."
 tad_bg_postwar.7.a:0 "A stronger republic, built rather than proclaimed."

 TAD_BG_postwar_partnership:0 "Postwar Economic Partnership"
