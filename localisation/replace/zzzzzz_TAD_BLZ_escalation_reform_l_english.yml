l_english:
 BLZ_warn_people_imminent_crisis_desc:0 "At forty points of tension, silence would become negligence. Inform the public, activate local defence plans and establish a unified crisis-readiness structure."
 BLZ_appeal_foreign_volunteers_desc:0 "Build the diplomatic and administrative network needed to integrate regional volunteers. Formal authority to purchase foreign divisions comes from the Emergency Defense Act."
 BLZ_prepare_armed_personnel:0 "Prepare the Belizean Armed Personnel"
 BLZ_prepare_armed_personnel_desc:0 "The Belize Defence Force cannot meet the coming crisis alone. Border guards, police units and local law-enforcement personnel must be integrated into a common readiness system before the first shots are fired."
 BLZ_start_drills_launch_intelligence:0 "Start Military Drills and Launch Intelligence"
 BLZ_start_drills_launch_intelligence_desc:0 "Public jungle exercises will demonstrate resolve while a quieter effort begins across the frontier: tracking patrol routes, depots and brigade movements inside Guatemala."
 BLZ_solicit_protection:0 "Solicit Protection"
 BLZ_solicit_protection_desc:0 "Belize will discreetly approach a regional partner and request direct military assistance. The scale of the reply will depend on the government we choose—and on how much risk it is willing to accept."
 BLZ_proclaim_emergency_defense_act:0 "Proclaim the Emergency Defense Act"
 BLZ_proclaim_emergency_defense_act_desc:0 "Emergency legislation will prepare the economy, state institutions and civilian population for an increasingly unavoidable confrontation. It will also authorize the recruitment of foreign combat formations."
 BLZ_fortify_mopan_border:0 "Fortify the Mopan Border"
 BLZ_fortify_mopan_border_desc:0 "Trenches, wire obstacles, concealed supply caches and machine-gun positions will cover the most likely approaches from Guatemala."
 BLZ_preemptive_border_garrison:0 "Pre-emptive Border Garrison"
 BLZ_preemptive_border_garrison_desc:0 "The armed forces will occupy the frontier in full combat readiness. From this point onward, no sector may be abandoned without orders from Belmopan."
 BLZ_convert_our_industry:0 "Convert Our Industry"
 BLZ_convert_our_industry_desc:0 "The crisis has reached its final stage. Civilian production must be redirected toward weapons, transport and the uninterrupted supply of the defence forces."

 BLZ_prepared_armed_personnel:0 "Prepared Armed Personnel"
 BLZ_prepared_armed_personnel_desc:0 "Belize's armed personnel, border guards and law-enforcement bodies have been trained to move and operate as a coordinated emergency force."
 BLZ_joint_drills_intelligence:0 "Joint Drills and Petén Intelligence"
 BLZ_joint_drills_intelligence_desc:0 "The public drills improve doctrine while a dedicated intelligence effort accelerates network construction across the Guatemalan frontier."
 BLZ_left_to_our_own_devices:0 "Left to Our Own Devices"
 BLZ_left_to_our_own_devices_desc:0 "Foreign assistance was refused. The public is angry and shaken—but also increasingly convinced that Belize must rely on itself."

 BLZ_mopan_border_incident_effect_tt:0 "Fortified border states sharply reduce Guatemalan effectiveness during frontier clashes through stronger core defence, slower enemy movement and additional attrition."
 BLZ_mopan_border_fortifications_state_modifier:0 "Mopan Border Fortifications"
 BLZ_mopan_border_fortifications_state_modifier_desc:0 "Prepared firing positions, wire obstacles and concealed supply points strengthen the approaches into Belize."
 BLZ_preemptive_garrison_state_modifier:0 "Pre-emptive Border Garrison"
 BLZ_preemptive_garrison_state_modifier_desc:0 "Permanent forward occupation has given local forces time to prepare and coordinate their defensive positions."
 BLZ_spy_disruption_state_modifier:0 "Belizean Intelligence Disruption"
 BLZ_spy_disruption_state_modifier_desc:0 "Covert networks are misdirecting transport, damaging supplies and feeding false reports into local command channels."

 TAD_BG_foreign_divisions_category:0 "Purchase Foreign Divisions — §Y[?BLZ.BLZ_foreign_contingents|0]§!/§Y[?BLZ.BLZ_foreign_division_cap|0]§!"
 TAD_BG_foreign_divisions_category_desc:0 "The Emergency Defense Act allows Belize to contract foreign formations. The cap rises with the crisis branch: §Y1§! after the Act, §Y2§! after fortifying Mopan, §Y3§! after the border garrison and §Y4§! after industrial conversion. Consumer-goods costs stack and the formations remain after the contract period."
 TAD_BLZ_peten_intelligence_category:0 "Spies in Petén"
 TAD_BLZ_peten_intelligence_category_desc:0 "Belize can fund ninety-day covert networks inside Guatemalan states. Each operation consumes rifles and ties up civilian industry. When the network expires, the operation must be financed again."

 BLZ_spies_in_peten:0 "Expand the Petén Network"
 BLZ_spies_in_peten_desc:0 "Fund guides, informants and supply interference teams throughout Petén for ninety days."
 BLZ_spies_in_verapaces:0 "Infiltrate the Verapaces"
 BLZ_spies_in_verapaces_desc:0 "Establish covert routes through the Verapaces and disrupt local military logistics for ninety days."
 BLZ_spies_in_izabal:0 "Penetrate Izabal Logistics"
 BLZ_spies_in_izabal_desc:0 "Target the Caribbean transport network and military staging points in Izabal for ninety days."
 BLZ_spies_in_western_highlands:0 "Recruit Highland Informants"
 BLZ_spies_in_western_highlands_desc:0 "Maintain a costly network among the western highland routes for ninety days."
 BLZ_spies_in_pacific_coast:0 "Compromise Pacific Supply Offices"
 BLZ_spies_in_pacific_coast_desc:0 "Bribe and infiltrate logistics offices on Guatemala's Pacific coast for ninety days."
 BLZ_spies_in_eastern_guatemala:0 "Disrupt Eastern Guatemala"
 BLZ_spies_in_eastern_guatemala_desc:0 "Sabotage transport schedules and communications in eastern Guatemala for ninety days."
 BLZ_spies_in_guatemala_department:0 "Plant Assets in Guatemala City"
 BLZ_spies_in_guatemala_department_desc:0 "The most expensive operation targets the capital's command and procurement networks for ninety days."

 BLZ_spy_cost_peten:0 "Petén Intelligence Expenditure"
 BLZ_spy_cost_verapaces:0 "Verapaces Intelligence Expenditure"
 BLZ_spy_cost_izabal:0 "Izabal Intelligence Expenditure"
 BLZ_spy_cost_western:0 "Highland Intelligence Expenditure"
 BLZ_spy_cost_pacific:0 "Pacific Intelligence Expenditure"
 BLZ_spy_cost_eastern:0 "Eastern Intelligence Expenditure"
 BLZ_spy_cost_capital:0 "Capital Intelligence Expenditure"

 tad_blz_reform.1.t:0 "Whom Should Belize Approach?"
 tad_blz_reform.1.d:0 "The cabinet has agreed to seek regional military protection, but a single government must be approached first. Jamaica offers political affinity and easy integration; the Dominican Republic can provide larger stocks and transport; Colombia possesses the deepest military resources but will be the hardest partner to persuade."
 tad_blz_reform.1.a:0 "Approach Jamaica."
 tad_blz_reform.1.b:0 "Approach the Dominican Republic."
 tad_blz_reform.1.c:0 "Approach Colombia."

 tad_blz_reform.2.t:0 "Belize Requests Jamaican Assistance"
 tad_blz_reform.2.d:0 "Belmopan has requested direct military supplies as the dispute with Guatemala worsens. Supporting Belize would reinforce a fellow Caribbean state, but it may also pull Jamaica into a dangerous confrontation."
 tad_blz_reform.2.a:0 "Send a major support package."
 tad_blz_reform.2.b:0 "Approve a medium package."
 tad_blz_reform.2.c:0 "Send a small symbolic shipment."
 tad_blz_reform.2.e:0 "We cannot become involved."
 tad_blz_reform.3.t:0 "Belize Requests Dominican Assistance"
 tad_blz_reform.3.d:0 "Belize has asked Santo Domingo for weapons, vehicles and logistical support. The request is urgent, but Guatemala will regard any shipment as direct interference."
 tad_blz_reform.3.a:0 "Send a major support package."
 tad_blz_reform.3.b:0 "Approve a medium package."
 tad_blz_reform.3.c:0 "Send a small package."
 tad_blz_reform.3.e:0 "Decline the request."
 tad_blz_reform.4.t:0 "Belize Requests Colombian Assistance"
 tad_blz_reform.4.d:0 "Belize has requested military equipment and professional assistance. Colombia could provide the most capable package, but doing so would be an unmistakable regional intervention."
 tad_blz_reform.4.a:0 "Commit a major package."
 tad_blz_reform.4.b:0 "Approve a medium package."
 tad_blz_reform.4.c:0 "Offer limited assistance."
 tad_blz_reform.4.e:0 "Refuse involvement."

 tad_blz_reform.10.t:0 "A Major Jamaican Support Package"
 tad_blz_reform.10.d:0 "Jamaica has approved a substantial shipment of rifles, support equipment, vehicles and convoy capacity. The package can immediately strengthen the BDF and its territorial formations."
 tad_blz_reform.11.t:0 "Jamaica Approves a Medium Package"
 tad_blz_reform.11.d:0 "Kingston has approved a practical package of weapons and support equipment, enough to improve several frontline units without openly committing Jamaican troops."
 tad_blz_reform.12.t:0 "A Symbolic Jamaican Shipment"
 tad_blz_reform.12.d:0 "Jamaica has sent a limited shipment. It will not transform the military balance, but it proves Belize is not entirely isolated."
 tad_blz_reform.13.t:0 "Left to Our Own Devices"
 tad_blz_reform.13.d:0 "Our request has been rejected. Confidence in foreign guarantees has fallen, but the refusal has hardened the public mood: Belize must prepare to survive with what it can build, buy or mobilize itself."
 tad_blz_reform.13.a:0 "Then we will defend ourselves."
 tad_blz_reform.14.t:0 "A Major Dominican Support Package"
 tad_blz_reform.14.d:0 "The Dominican Republic has released a large shipment of rifles, support equipment, vehicles and convoy capacity for Belize."
 tad_blz_reform.15.t:0 "Dominican Medium Support Approved"
 tad_blz_reform.15.d:0 "Santo Domingo has approved a balanced package of arms and transport equipment."
 tad_blz_reform.16.t:0 "Limited Dominican Assistance"
 tad_blz_reform.16.d:0 "A smaller Dominican shipment has arrived. It is modest, but immediately usable."
 tad_blz_reform.17.t:0 "Colombia Commits a Major Package"
 tad_blz_reform.17.d:0 "Colombia has approved an extensive shipment and dispatched advisers familiar with jungle operations and military logistics."
 tad_blz_reform.18.t:0 "Colombian Medium Support Approved"
 tad_blz_reform.18.d:0 "Bogotá has approved a substantial but carefully limited support package."
 tad_blz_reform.19.t:0 "Limited Colombian Assistance"
 tad_blz_reform.19.d:0 "Colombia has authorized a smaller shipment and a brief advisory mission."
 tad_blz_reform.ok:0 "Put it to immediate use."

 tad_blz_reform.25.t:0 "Suspected Belizean Intelligence Activity"
 tad_blz_reform.25.d:0 "Security reports indicate that Belize may be financing informants, transport disruption and false reporting inside our territory. The evidence is incomplete, but local commanders are demanding a response."
 tad_blz_reform.25.a:0 "Tighten military security."
 tad_blz_reform.25.b:0 "Publicly accuse Belize."
 tad_blz_reform.30.t:0 "The Emergency Defense Act"
 tad_blz_reform.30.d:0 "The emergency legislation is now in force. Belize can contract foreign divisions, mobilize additional resources and accelerate the preparation of the frontier. At first only one foreign formation may be purchased; the cap rises as the defensive branch advances."
 tad_blz_reform.30.a:0 "Prepare every institution."
