l_english:
 tad_cine.1.t:0 "The Fall of Port-au-Prince"
 tad_cine.1.d:0 "The government district has been overrun. Police stations stand abandoned, smoke rolls above the avenues, and armed men now move openly through the capital. The loss of Port-au-Prince has transformed a national emergency into a struggle for the survival of the Haitian state."
 tad_cine.1.a:0 "The capital must be retaken."
 tad_cine.2.t:0 "The National Palace Is Looted"
 tad_cine.2.d:0 "Crowds of gunmen have broken into government compounds and stripped offices, archives and storerooms. Documents burn in the courtyards while weapons and communications equipment disappear into the city. The symbolism is almost as damaging as the material loss."
 tad_cine.2.a:0 "A humiliation broadcast to the nation."
 tad_cine.3.t:0 "The Banks of Port-au-Prince Are Raided"
 tad_cine.3.d:0 "A coordinated gang operation has struck bank branches, cash depots and armoured transports across the metropolitan area. Millions vanish in a single afternoon, strengthening criminal war chests while confidence in the remaining institutions collapses."
 tad_cine.3.a:0 "The gangs are financing their war."
 tad_cine.4.t:0 "Fuel Convoy Hijacked"
 tad_cine.4.d:0 "A guarded fuel convoy has been ambushed on the road into the capital. Tankers have been driven away, escorts scattered and several vehicles set alight. Hospitals, generators and police units now compete for what little fuel remains."
 tad_cine.4.a:0 "Every litre now matters."
 tad_cine.5.t:0 "The Port Warehouses Burn"
 tad_cine.5.d:0 "Explosions have torn through warehouses near the port. Ammunition, food and imported equipment burn beneath a column of black smoke visible across the bay. Whether the attack was theft, sabotage or both no longer matters—the supplies are gone."
 tad_cine.5.a:0 "The city will feel this loss."
 tad_cine.6.t:0 "Mass Prison Break"
 tad_cine.6.d:0 "The gates have been blown open and hundreds of detainees have escaped into the capital. Gang recruiters wait outside with vehicles and rifles. Police commanders warn that many of the men released tonight will return to the streets before dawn."
 tad_cine.6.a:0 "The crisis feeds itself."
 tad_cine.7.t:0 "The Airport Falls Silent"
 tad_cine.7.d:0 "Gunfire around the perimeter and repeated attacks on access roads have halted civilian operations. Aircraft sit grounded while foreign crews refuse to land. Haiti has lost another lifeline to the outside world."
 tad_cine.7.a:0 "Isolation closes in."
 tad_cine.8.t:0 "Cap-Haïtien Is Seized"
 tad_cine.8.d:0 "Armed forces hostile to the government have entered Cap-Haïtien. Roadblocks cut the northern approaches and frightened residents crowd the waterfront. The loss of the northern city threatens to split the country in two."
 tad_cine.8.a:0 "The north cannot be abandoned."
 tad_cine.9.t:0 "Gonâve Is Plundered"
 tad_cine.9.d:0 "Raiding parties have crossed to Gonâve, looting warehouses, fuel stores and coastal settlements. Development sites stand abandoned and frightened families flee inland. The island that was meant to become a symbol of recovery has become another battlefield."
 tad_cine.9.a:0 "We will remember who did this."
 tad_cine.10.t:0 "The Government Returns to the Capital"
 tad_cine.10.d:0 "Government troops have reopened the main roads and raised the Haitian flag over the administrative district. The damage is immense, but ministries are returning and police patrols have reappeared. Port-au-Prince is not secure—but it is no longer lost."
 tad_cine.10.a:0 "The republic still lives."
 tad_cine.11.t:0 "A Humanitarian Corridor Opens"
 tad_cine.11.d:0 "Church groups, aid organisations and local commanders have negotiated a narrow corridor through the violence. For a few hours each day, ambulances and food convoys may pass. Protecting it will be expensive, but thousands could depend on it."
 tad_cine.11.a:0 "Guard the corridor."
 tad_cine.11.b:0 "We cannot spare the men."
 tad_cine.12.t:0 "Jimmy Chérizier Is Captured"
 tad_cine.12.d:0 "Viv Ansanm has fractured under military pressure and internal betrayal. During the collapse of the coalition’s remaining positions, Jimmy Chérizier has been taken into custody. His capture deprives the capital’s largest armed bloc of its most recognisable commander."
 tad_cine.12.a:0 "Barbecue will command no more streets."
 tad_cine.13.t:0 "Luckson Elan Is Captured"
 tad_cine.13.d:0 "Gran Grif’s remaining positions in Artibonite have been dismantled and Luckson Elan has been captured during the final sweep around Savien. Weapons caches have been seized, and guarded traffic is beginning to return to the main roads."
 tad_cine.13.a:0 "Gran Grif has lost its leader and its stronghold."
 tad_cine.14.t:0 "Vitel’Homme Innocent Is Captured"
 tad_cine.14.d:0 "Kraze Baryè has lost its final organised positions, and Vitel’Homme Innocent has been captured as government forces clear the eastern corridor. Remaining fighters are abandoning weapons and scattering away from the capital."
 tad_cine.14.a:0 "The eastern network has been broken."
 tad_cine.15.t:0 "The Guns Fall Silent"
 tad_cine.15.d:0 "The principal armed coalitions have been defeated and government authority is returning across Haiti. The cost is visible in every city and every displaced family. Victory has not repaired the country—but for the first time, rebuilding is possible."
 tad_cine.15.a:0 "Now begins the harder task."
 tad_cine.20.t:0 "The Mopan Line Is Complete"
 tad_cine.20.d:0 "Trenches, wire obstacles and prepared firing positions now cover the most likely approaches from Guatemala. Belize cannot match its neighbour in numbers, but every road and river crossing has been surveyed, stocked and assigned to a defending unit."
 tad_cine.20.a:0 "Make every kilometre costly."
 tad_cine.21.t:0 "Foreign Volunteers Arrive"
 tad_cine.21.d:0 "A mixed contingent of foreign volunteers has landed in Belize City and moved inland under BDF escort. Their languages, equipment and experience differ, but their presence sends a clear message: Belize will not face the crisis entirely alone."
 tad_cine.21.a:0 "Welcome them to the line."
 tad_cine.22.t:0 "Port Belize Expanded"
 tad_cine.22.d:0 "New berths, storage yards and coastal facilities have opened at Belize City. The expanded port can sustain emergency imports, military shipments and a larger commercial fleet—an investment in both national defence and postwar prosperity."
 tad_cine.22.a:0 "Belize faces the Caribbean with confidence."
 tad_cine.23.t:0 "Belmopan Under Fire"
 tad_cine.23.d:0 "Guatemalan forces have entered the capital district. Government offices are evacuating, roads are clogged with civilians and BDF units are fighting from prepared positions around Belmopan. The survival of the state now depends on holding what remains."
 tad_cine.23.a:0 "There will be no easy victory for Guatemala."
 tad_cine.24.t:0 "Belize Endures"
 tad_cine.24.d:0 "The war has ended without the destruction of Belizean sovereignty. Against overwhelming odds, the BDF, territorial units and foreign volunteers held long enough for international and domestic pressure to force an end to the fighting."
 tad_cine.24.a:0 "A small nation has survived."
 tad_cine.30.t:0 "Petén Is Mobilised"
 tad_cine.30.d:0 "Columns of Guatemalan troops, engineers and supply vehicles are moving north through Petén. Temporary depots appear along the roads and patrols probe the adjacency line. What was once political pressure is becoming military preparation."
 tad_cine.30.a:0 "The northern command is ready."
 tad_cine.31.t:0 "Across the Adjacency Line"
 tad_cine.31.d:0 "Guatemalan units have crossed into Belize. Artillery fire echoes through the jungle and forward battalions advance along narrow roads toward the interior. The territorial dispute has become an open war."
 tad_cine.31.a:0 "The operation has begun."
 tad_cine.32.t:0 "Belmopan Captured"
 tad_cine.32.d:0 "Guatemalan troops have entered Belmopan after heavy fighting. Government buildings are occupied and the Guatemalan flag has been raised over key intersections. Yet Belizean units remain active elsewhere, and the war is not necessarily over."
 tad_cine.32.a:0 "A major objective is in our hands."
 tad_cine.33.t:0 "Stalemate in the Jungle"
 tad_cine.33.d:0 "The advance has slowed to a crawl. Roads dissolve into mud, patrols vanish beneath the canopy and every bridge must be guarded. Belizean defenders surrender ground reluctantly, forcing Guatemala to pay for every kilometre."
 tad_cine.33.a:0 "The timetable is slipping."
 tad_cine.34.t:0 "Belizean Resistance Intensifies"
 tad_cine.34.d:0 "Supply vehicles are being ambushed, telephone lines cut and local guides deliberately misdirect patrols. The occupation is producing a resistance network faster than military planners expected."
 tad_cine.34.a:0 "Secure the rear areas."
 tad_cine.35.t:0 "The Northern Army Returns"
 tad_cine.35.d:0 "The troops are returning from Belize beneath a cloud of political argument. Some are greeted as veterans; others are blamed for a costly failure. The army has learned hard lessons in the jungle, but the country must now decide what the campaign meant."
 tad_cine.35.a:0 "The reckoning begins at home."
 tad_cine.news.a:0 "A significant development."
 tad_cine.101.t:0 "The Fall of Port-au-Prince"
 tad_cine.101.d:0 "Armed groups have overrun Haiti's government district and seized large parts of Port-au-Prince. The state retains forces elsewhere, but control of the capital has effectively collapsed."
 tad_cine.102.t:0 "Haiti Has Fallen"
 tad_cine.102.d:0 "The Haitian government has capitulated after the country's security crisis erupted into open war. Rival armed groups now compete over the ruins of the state."
 tad_cine.103.t:0 "Viv Ansanm Collapses"
 tad_cine.103.d:0 "Haiti's largest gang coalition has lost its remaining organised territory. The fall of Viv Ansanm marks a decisive shift in the struggle for Port-au-Prince."
 tad_cine.104.t:0 "Gran Grif Defeated"
 tad_cine.104.d:0 "Gran Grif has been driven from its strongholds in Artibonite. Government forces have reopened key roads through central Haiti."
 tad_cine.105.t:0 "Kraze Barye Destroyed"
 tad_cine.105.d:0 "The Kraze Barye organisation has ceased to exist as a coherent military force following the loss of its eastern strongholds."
 tad_cine.106.t:0 "Haiti Reclaims the Republic"
 tad_cine.106.d:0 "The principal armed coalitions have been defeated and the Haitian government has restored control over the country. Reconstruction begins amid enormous destruction."
 tad_cine.107.t:0 "The Fall of Belize"
 tad_cine.107.d:0 "Belize has capitulated to Guatemala after a brief but bitter campaign. The future of the small Caribbean state is now uncertain."
 tad_cine.108.t:0 "Belize Survives the War"
 tad_cine.108.d:0 "Belize has emerged from war with its sovereignty intact. Its resistance against a far larger neighbour has become a defining moment across the Caribbean."
 tad_cine.109.t:0 "Guatemala Captures Belmopan"
 tad_cine.109.d:0 "Guatemalan troops have occupied the Belizean capital of Belmopan. Fighting continues elsewhere as international pressure mounts for a ceasefire."
 tad_cine.110.t:0 "Guatemala Defeats Belize"
 tad_cine.110.d:0 "Belize has capitulated after Guatemalan forces seized its key population centres. Guatemala now faces the diplomatic and military consequences of occupation."
 tad_cine.111.t:0 "Guatemala Withdraws from Belize"
 tad_cine.111.d:0 "The campaign against Belize has ended without a decisive Guatemalan victory. Troops are withdrawing as domestic criticism and international pressure intensify."

tad_cine.16.t:0 "The Armed Personnel Are Ready"
tad_cine.16.d:0 "Belize's border police, reservists and local security personnel have been reorganised for emergency service. Weapons have been issued, supply caches inventoried and district commanders brought into a single contingency chain. The country remains small, but it is no longer unprepared."
tad_cine.16.a:0 "Every pair of trained hands will matter."
tad_cine.17.t:0 "Military Drills Begin in the Jungle"
tad_cine.17.d:0 "Belizean formations have begun live exercises near the threatened frontier while intelligence teams quietly map roads, crossings and likely infiltration routes. The message is unmistakable: Belmopan is preparing for a crisis that may yet become a war."
tad_cine.17.a:0 "Train hard, watch everything."
tad_cine.18.t:0 "Belize Starts Military Drills"
tad_cine.18.d:0 "Belizean drills near the frontier are being watched closely in Guatemala. Officials in Guatemala City dismiss them as symbolic, but military planners note that the smaller state is clearly preparing its defence in earnest."
tad_cine.18.a:0 "Then we will watch them more closely."
tad_cine.19.t:0 "Belize Solicits Protection"
tad_cine.19.d:0 "Belmopan has begun sounding out friendly governments across the Caribbean and Latin America. The request is modest in words but serious in implication: Belize wants outside assistance before the dispute with Guatemala turns into open conflict."
tad_cine.19.a:0 "The world must understand our position."
tad_cine.25.t:0 "Shots Fired at the Border"
tad_cine.25.d:0 "A tense standoff along the frontier has erupted into a brief exchange of gunfire. No major formations have crossed the line, but patrols on both sides now report casualties, damaged vehicles and a sharp rise in fear among nearby communities."
tad_cine.25.a:0 "Tighten the line and prepare for worse."
tad_cine.26.t:0 "Shots Fired at the Border"
tad_cine.26.d:0 "A frontier patrol has exchanged fire with Belizean forces during a tense encounter along the disputed border. Though limited in scale, the clash hardens opinion in Guatemala and gives the army new arguments for a stronger response."
tad_cine.26.a:0 "This incident will not be ignored."
tad_cine.37.t:0 "International Pressure Mounts"
tad_cine.37.d:0 "The longer the war drags on, the harder it becomes to control the diplomatic consequences. Caribbean governments, foreign missions and humanitarian organisations are now openly pressing Guatemala to end the campaign before the conflict does lasting damage to the region."
tad_cine.37.a:0 "Pressure abroad becomes pressure at home."
